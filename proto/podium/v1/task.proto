syntax = "proto3";

package podium.v1;

import "google/protobuf/timestamp.proto";
import "podium/v1/common.proto";
import "podium/v1/node.proto";

// TaskService is the operator-facing API used by the CLI and the web UI.
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  // InjectTask delivers one human message into a running task's inbox. It does not
  // cancel, finish, or otherwise move the task: the container stays up, and whatever
  // is waiting on the inbox — an interactive playbook's ask tool — reads the text.
  // Refused if the task is not running or has no node.
  rpc InjectTask(InjectTaskRequest) returns (InjectTaskResponse);
  // StreamTaskEvents replays stored events from from_seq and then follows live ones.
  rpc StreamTaskEvents(StreamTaskEventsRequest) returns (stream TaskEvent);
}

message Task {
  string id = 1;
  TaskSpec spec = 2;
  TaskStatus status = 3;
  string node_id = 4;
  int32 attempts = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  // Unset until the task has exited.
  optional int32 exit_code = 9;
  Usage usage = 10;
  string requested_by = 11;
  // failure_reason says why a task could not run when there is no exit code to explain
  // it: a missing secret, an out-of-memory kill, an assignment that never reached a node.
  // Empty otherwise. It never carries a secret value — only names.
  string failure_reason = 12;
  // queued_reason says why a queued task has not been scheduled yet — no node carries its
  // labels, every eligible node is full, nothing is online. Empty once it is assigned.
  string queued_reason = 13;
  // last_schedule_attempt_at is when the scheduler last looked at this task and could not
  // place it. Unset for a task it has never had to skip.
  google.protobuf.Timestamp last_schedule_attempt_at = 14;
  // priority orders the queue: the scheduler claims higher first, and ties go to whichever
  // was created first. Zero is the default, and negative is allowed — it is a sort key and
  // not a budget, so it changes what runs next and nothing about what a task is given.
  int32 priority = 15;
}

message CreateTaskRequest {
  TaskSpec spec = 1;
  int32 priority = 2;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

message TaskFilter {
  repeated TaskStatus status = 1;
  string node_id = 2;
  string requested_by = 3;
  // search narrows the page to tasks whose id starts with it or whose image contains it,
  // case-insensitively. It is a substring match, not a query language.
  string search = 4;
  // created_after and created_before bound the page by creation time — after is inclusive,
  // before is exclusive. Either one unset leaves that side unbounded. They exist for the
  // usage screen, which asks a calendar question ("what ran in September?") that an id
  // cursor alone cannot answer.
  google.protobuf.Timestamp created_after = 5;
  google.protobuf.Timestamp created_before = 6;
}

message Page {
  int32 limit = 1;
  string cursor = 2;
}

message ListTasksRequest {
  TaskFilter filter = 1;
  Page page = 2;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  // Empty when there is no further page.
  string next_cursor = 2;
}

message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelTaskResponse {
  Task task = 1;
}

message InjectTaskRequest {
  string task_id = 1;
  string text = 2;
}

message InjectTaskResponse {}

message StreamTaskEventsRequest {
  string task_id = 1;
  // Exclusive: the stream starts at from_seq + 1. Zero replays from the beginning.
  uint64 from_seq = 2;
}
