syntax = "proto3";

package podium.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "podium/v1/common.proto";

// NodeAdminService is the operator-facing node API.
service NodeAdminService {
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // RekeyNode unbinds a node from the Tailscale device it enrolled from, so the same node
  // identity may reconnect from a rebuilt or replaced machine. The next Hello rebinds it.
  rpc RekeyNode(RekeyNodeRequest) returns (RekeyNodeResponse);
  // DrainNode stops a node being given new work. Running tasks finish; the node exits 0
  // when it was started with --exit-on-drain, which is the upgrade path.
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  // UndrainNode puts a drained node back in the pool.
  rpc UndrainNode(UndrainNodeRequest) returns (UndrainNodeResponse);
  // SetNodeSlots changes how many tasks a node runs at once, overriding the max_tasks in
  // its own configuration file.
  rpc SetNodeSlots(SetNodeSlotsRequest) returns (SetNodeSlotsResponse);
  // DeleteNode forgets a node. It refuses a node that is still online and not drained.
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
}

message Node {
  string id = 1;
  string name = 2;
  NodeStatus status = 3;
  repeated string labels = 4;
  NodeCapacity capacity = 5;
  int32 running_tasks = 6;
  int32 free_slots = 7;
  string version = 8;
  google.protobuf.Timestamp last_heartbeat_at = 9;
  google.protobuf.Timestamp created_at = 10;
  // ts_stable_id is the Tailscale device this node is bound to, empty when it is unbound
  // (never enrolled over a tailnet, or rekeyed).
  string ts_stable_id = 11;
  // draining is the operator's standing instruction that this node takes no new work. It
  // survives a node restart and a server restart; status is DRAINING while it is connected.
  bool draining = 12;
  // max_tasks_override is the slot count an operator set from the control plane. Unset means
  // the node's own max_tasks decides, which is what capacity.max_tasks reports; when it IS
  // set it is the number the scheduler and the node both budget against, and capacity is
  // still what the node's configuration says.
  optional int32 max_tasks_override = 13;
}

message CreateEnrollmentTokenRequest {
  repeated string labels = 1;
  google.protobuf.Duration ttl = 2;
}

message CreateEnrollmentTokenResponse {
  // SENSITIVE: never log. Returned once; the server keeps only its SHA-256.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message RekeyNodeRequest {
  string node_id = 1;
}

message RekeyNodeResponse {
  Node node = 1;
}

message DrainNodeRequest {
  string node_id = 1;
}

message DrainNodeResponse {
  Node node = 1;
}

message UndrainNodeRequest {
  string node_id = 1;
}

message UndrainNodeResponse {
  Node node = 1;
}

message SetNodeSlotsRequest {
  string node_id = 1;
  // max_tasks is how many tasks this node may run at once. Zero clears the override, which
  // returns the node to the max_tasks in its own configuration file.
  int32 max_tasks = 2;
}

message SetNodeSlotsResponse {
  Node node = 1;
}

message DeleteNodeRequest {
  string node_id = 1;
  // force deletes a node that is still online. It does not stop what it is running.
  bool force = 2;
}

message DeleteNodeResponse {}
