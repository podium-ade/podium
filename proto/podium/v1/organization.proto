syntax = "proto3";

package podium.v1;

import "google/protobuf/timestamp.proto";

// OrganizationService is what this deployment is called and whose it is. Every signed-in
// caller reads the names through WhoAmI as well; changing them is an admin's.
service OrganizationService {
  // GetOrganization returns the names as saved. Empty fields were never set.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  // UpdateOrganization replaces both names. Send the one you are not changing as it was.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);
}

// Organization is the two names. Both empty is the default: the UI and the agent then call
// the deployment "Podium" and name no organization.
message Organization {
  // organization_name is the company or team this deployment serves ("Acme Corp"). The
  // agent is told it works for them. At most 80 characters.
  string organization_name = 1;
  // deployment_name replaces "Podium" in the UI and in what the agent calls itself and the
  // product ("Acme AI"). At most 40 characters.
  string deployment_name = 2;
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetOrganizationRequest {}

message GetOrganizationResponse {
  Organization organization = 1;
}

message UpdateOrganizationRequest {
  string organization_name = 1;
  string deployment_name = 2;
}

message UpdateOrganizationResponse {
  Organization organization = 1;
}
