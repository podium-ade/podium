syntax = "proto3";

package podium.v1;

// IdentityService answers "who does the server think I am". Under the tailnet transport the
// answer comes from Tailscale's WhoIs and the call needs no credential at all, which is how the
// web UI knows it can skip its token prompt: if WhoAmI succeeds unauthenticated, identity is
// already established.
service IdentityService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
}

// IdentityKind mirrors the transport's own taxonomy.
enum IdentityKind {
  IDENTITY_KIND_UNSPECIFIED = 0;
  // A human, named by their Tailscale login.
  IDENTITY_KIND_USER = 1;
  // A worker, proved by its Tailscale ACL tag.
  IDENTITY_KIND_NODE = 2;
  // The local transport's shared bearer token, which has no per-user identity.
  IDENTITY_KIND_LOCAL_TOKEN = 3;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  // login is the Tailscale login name of a user, the device name of a node, or "local".
  string login = 1;
  string display_name = 2;
  IdentityKind kind = 3;
  // tags are the calling device's ACL tags. Empty for a human and under the local transport.
  repeated string tags = 4;
  // server_version is the control plane's build version: a release tag such as "v0.3.1", or
  // "dev" for an unstamped build. `podium version` compares it with its own and warns on skew.
  string server_version = 5;
  // server_commit is the short git commit the control plane was built from, or "none".
  string server_commit = 6;
  // agent_enabled is true when this control plane has a conductor configured
  // (PODIUM_AGENT_URL is set) and therefore proxies podium.agent.v1.AgentService. The web
  // UI hides its Agent screen when it is false; `podium version` ignores it.
  bool agent_enabled = 7;
}
