syntax = "proto3";

package podium.v1;

import "google/protobuf/timestamp.proto";

// SecretService is the operator-facing secret store. No person can read a value back: it
// goes in once and comes back out inside an Assign, on its way to the node that is about to
// run the task that asked for it, or through ReadSecret to the conductor alone.
service SecretService {
  // SetSecret creates or replaces a secret, bumping its version.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // ListSecrets returns metadata only: names, versions and who set them.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // ReadSecret returns one value to the conductor and to no other caller, and only for the
  // names the conductor keeps for its own use: its connection credentials
  // (podium.agent.connection.*), the per-turn GitHub tokens it must revoke
  // (podium.agent.git_user_token.*), and a person's connected account (github.token). Every
  // read is audited.
  rpc ReadSecret(ReadSecretRequest) returns (ReadSecretResponse);
}

// Secret is the metadata of a stored secret. It never carries the value or the
// ciphertext.
// SecretScope says whether a secret is shared by the conductor or owned by one login.
// Unspecified is global, so a caller from before scopes existed still writes a global secret.
enum SecretScope {
  SECRET_SCOPE_UNSPECIFIED = 0;
  SECRET_SCOPE_GLOBAL = 1;
  SECRET_SCOPE_PERSONAL = 2;
}

message Secret {
  string name = 1;
  // version starts at 1 and increases by one on every SetSecret.
  int32 version = 2;
  // key_id identifies the master key the value is encrypted under, so a half-finished
  // rotation is visible.
  string key_id = 3;
  string created_by = 4;
  google.protobuf.Timestamp updated_at = 5;
  // scope is global or personal. A list never includes another login's personal row.
  SecretScope scope = 6;
  // owner is the login of a personal secret, and empty for a global one.
  string owner = 7;
}

message SetSecretRequest {
  string name = 1;
  // SENSITIVE: never log. Bytes rather than a string: a secret is not necessarily text.
  bytes value = 2;
  // scope defaults to global when unspecified. A person's own write ignores owner:
  // the owner is the caller. The conductor may set owner, and only for a personal
  // MCP credential (mcp.<server>_token) or a connected GitHub account (github.token),
  // which are that person's secrets.
  SecretScope scope = 3;
  // owner is the login of a personal secret. Only the conductor may set it.
  string owner = 4;
}

message SetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  // owner, when set by the conductor, includes that login's personal MCP credentials
  // along with every global name. A person who sets it must name themselves. Any
  // other caller who sets it is refused.
  string owner = 1;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
}

message DeleteSecretRequest {
  string name = 1;
  // scope defaults to global when unspecified.
  SecretScope scope = 2;
  // owner is the login of a personal secret. Only the conductor may set it, and
  // only for a personal MCP credential or github.token. A person's own delete ignores it.
  string owner = 3;
}

message DeleteSecretResponse {}

message ReadSecretRequest {
  string name = 1;
  // owner is the login of a personal secret, and empty for a global one.
  string owner = 2;
}

message ReadSecretResponse {
  // SENSITIVE: never log.
  bytes value = 1;
}
