syntax = "proto3";

package podium.v1;

import "google/protobuf/duration.proto";

// TaskStatus mirrors the tasks.status column.
// queued -> scheduled -> provisioning -> running -> succeeded | failed | cancelled | lost
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_QUEUED = 1;
  TASK_STATUS_SCHEDULED = 2;
  TASK_STATUS_PROVISIONING = 3;
  TASK_STATUS_RUNNING = 4;
  TASK_STATUS_SUCCEEDED = 5;
  TASK_STATUS_FAILED = 6;
  TASK_STATUS_CANCELLED = 7;
  TASK_STATUS_LOST = 8;
}

// NodeStatus is derived from heartbeat recency: unreachable after 30s, offline after 120s.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_ONLINE = 1;
  NODE_STATUS_UNREACHABLE = 2;
  NODE_STATUS_OFFLINE = 3;
  NODE_STATUS_DRAINING = 4;
}

// TaskSpec is the wire form of pkg/spec.TaskSpec.
message TaskSpec {
  string image = 1;
  repeated string command = 2;
  // Defaults to /workspace.
  string working_dir = 3;
  map<string, string> env = 4;
  // Node labels the task requires; a node is eligible when labels are a subset of its own.
  repeated string labels = 5;
  // Defaults to 1h.
  google.protobuf.Duration timeout = 6;
  // Defaults to 1.
  int32 max_attempts = 7;
  // Sibling containers started before the task, keyed by the DNS name the task reaches
  // them under on the task network. "task" is reserved.
  map<string, Sidecar> sidecars = 8;
  // Limits applied to the task container.
  Resources resources = 9;
  // The task container's sandbox. Capabilities are all dropped and no-new-privileges is
  // always set; these fields are the only dials.
  Hardening hardening = 10;
  // Named secrets the task needs. The spec carries names only; the values are resolved
  // by the server immediately before the assignment and never stored on the task.
  repeated SecretRef secrets = 11;
  // When the node running this task goes offline mid-run, requeue the task as a new
  // attempt (up to max_attempts) instead of marking it lost. Off by default: a task that
  // is not idempotent must not be silently run twice.
  bool retry_on_node_loss = 12;
  // Conversation this task's /workspace belongs to. When set, the node restores that
  // session's latest snapshot (or the repository base) before the task starts and uploads
  // a new one after a clean exit. Empty keeps the volume ephemeral.
  string workspace_session = 13;
  // Repository a base snapshot is stored under. Sent with the download so a session that
  // has never snapshotted can start from the base.
  string workspace_repo = 14;
  // Also store this task's workspace as the shared base for workspace_repo.
  bool workspace_publish_base = 15;
  // How long the runtime stays up after a turn, waiting for the next instruction on the
  // inbox. Zero means exit when the turn ends. The node forwards it as
  // PODIUM_WORKSPACE_WARM_SECONDS; it does not itself keep the container alive.
  google.protobuf.Duration workspace_warm = 16;
}

// SecretRef names a stored secret and says where the task wants it. Nothing here is
// sensitive: it is the name of a value, never the value.
message SecretRef {
  // name is the key the secret is stored under.
  string name = 1;
  // target is "env" or "file".
  string target = 2;
  // key is the environment variable name for target "env", or the absolute path the
  // value is mounted at for target "file".
  string key = 3;
}

// Resources caps one container. The node applies the limits blindly; refusing a task that
// asks for more than a node has is the scheduler's job.
message Resources {
  // Cores. 0.5 means half a core; 0 means unlimited.
  double cpu = 1;
  // Memory cap in MB. Swap is pinned to the same value, so a container never swaps.
  int64 memory_mb = 2;
  // Maximum process count. Defaults to 4096.
  int32 pids = 3;
}

// Readiness is how the node decides a sidecar is usable. At most one probe may be set; a
// sidecar with none is ready as soon as its container is running.
message Readiness {
  int32 tcp_port = 1;
  string http_path = 2;
  // Defaults to 80 when http_path is set.
  int32 http_port = 3;
  repeated string command = 4;
  // Defaults to 60s.
  google.protobuf.Duration timeout = 5;
}

// Sidecar is a sibling container on the task's network.
message Sidecar {
  string image = 1;
  repeated string command = 2;
  map<string, string> env = 3;
  Readiness readiness = 4;
  Resources resources = 5;
  // Run the sidecar with every capability and no device restriction — root on the node's
  // kernel. It is for a Docker daemon beside the task and nothing else, and it is only a
  // request: a node started without --allow-privileged-sidecars refuses the task.
  bool privileged = 6;
  // Mount the task's workspace volume in the sidecar at the task's own working path. A
  // nested daemon resolves bind-mount sources in its own filesystem, so a build context
  // under /workspace reaches it no other way.
  bool share_workspace = 7;
}

// Hardening relaxes or tightens the task container's sandbox.
message Hardening {
  // When true the image's filesystem is read-only; /workspace and /tmp stay writable.
  bool read_only_rootfs = 1;
  // Capabilities added back after all are dropped. Restricted to CHOWN, DAC_OVERRIDE,
  // FOWNER, SETUID, SETGID, NET_BIND_SERVICE and KILL.
  repeated string capabilities = 2;
}

// Usage is the resource accounting reported when a task finishes.
message Usage {
  double cpu_seconds = 1;
  int64 peak_memory_mb = 2;
  int64 wall_ms = 3;
}

// NodeCapacity is what a node advertises in Hello and what ListNodes reports back.
message NodeCapacity {
  int32 max_tasks = 1;
  int32 cpu_cores = 2;
  int64 memory_mb = 3;
}
