syntax = "proto3";

package podium.agent.v1;

import "google/protobuf/timestamp.proto";

// AgentService is the conductor's own API. It is served on PODIUM_AGENT_LISTEN behind a
// bearer token and reached from a browser only through podium-server, which proxies
// /podium.agent.v1.AgentService/ behind its identity middleware. It grew by step:
// sessions (17), settings (18), memory (19), playbooks and chat (21).
service AgentService {
  // ListSessions returns conversations the bot has taken part in, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // ListTurns returns one session's turns, newest first.
  rpc ListTurns(ListTurnsRequest) returns (ListTurnsResponse);
  // GetSettings reports what the conductor is configured with. It reads no secret value:
  // there is no read endpoint on the secret store, by design.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // SetProviderKey validates a provider key with the provider itself and, only if that
  // succeeds, stores it as a Podium secret. An unvalidated key is never saved.
  rpc SetProviderKey(SetProviderKeyRequest) returns (SetProviderKeyResponse);
  // ClearProviderKey removes the secret and the metadata. Calling it twice is not an error.
  rpc ClearProviderKey(ClearProviderKeyRequest) returns (ClearProviderKeyResponse);
  // StartProviderOAuth begins a device-authorisation sign-in for a provider that takes a
  // subscription instead of an API key. It stores nothing: it returns the code and the URL
  // a human has to visit, and PollProviderOAuth is what finishes.
  rpc StartProviderOAuth(StartProviderOAuthRequest) returns (StartProviderOAuthResponse);
  // PollProviderOAuth asks the provider whether the human has approved the sign-in yet. It
  // is the browser that polls, at the interval the start response asked for. Only the call
  // that comes back authorised stores anything.
  rpc PollProviderOAuth(PollProviderOAuthRequest) returns (PollProviderOAuthResponse);
  // ListAgents reports the agent backends this conductor can run a turn on, the models each
  // offers and the effort levels each model accepts. It is the catalogue behind the UI's
  // picker, and it is the same list the write RPCs validate against.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // ListMemories pages through the shared memory, newest first.
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  // SearchMemories is a semantic search of the same memory.
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  // DeleteMemory takes one memory out of every future recall. It is a tombstone rather
  // than a row deletion: the memory engine keeps the record for audit and stops serving it.
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  // ListPlaybooks reports the profile's playbooks so the chat can offer them. Nothing secret:
  // a name, an image and which one the chat starts with.
  rpc ListPlaybooks(ListPlaybooksRequest) returns (ListPlaybooksResponse);
  // GetProfile reports the profile a turn actually runs from — profile.yaml and playbooks/
  // merged with what the conductor's database holds — and every playbook in full, so a
  // browser can manage them.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // UpdateProfile overrides profile.yaml's display name, model and default playbooks. An
  // empty field clears the override and returns that field to the file's value.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // CreatePlaybook stores a new playbook in the conductor's database. A name a playbooks/*.yaml
  // already defines is refused: the files are authoritative for the names they hold.
  rpc CreatePlaybook(CreatePlaybookRequest) returns (CreatePlaybookResponse);
  // UpdatePlaybook replaces a stored playbook. A file-defined playbook is refused.
  rpc UpdatePlaybook(UpdatePlaybookRequest) returns (UpdatePlaybookResponse);
  // DeletePlaybook removes a stored playbook. A file-defined playbook is refused; deleting a
  // stored playbook that is not there is not an error.
  rpc DeletePlaybook(DeletePlaybookRequest) returns (DeletePlaybookResponse);
  // CreateChat opens a new web-chat conversation owned by the calling login.
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  // ListChats returns the caller's own chats, newest first. Another login's chats are
  // never returned.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  // SendChatMessage stores one human message and starts a turn on it. It is refused with
  // FailedPrecondition while a turn for that chat is already running: one turn at a time
  // per conversation is the whole model.
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse);
  // StreamChat replays a chat from from_seq and then follows it live. It never ends on its
  // own; the client cancels. Progress frames are ephemeral and are not replayed.
  rpc StreamChat(StreamChatRequest) returns (stream ChatFrame);
}

// Session is one conversation: a Slack thread, a Linear issue, a web chat. Its identity is
// source_key, which the source computes and the conductor never parses.
message Session {
  string id = 1;
  // source_kind is "slack", "dev", and later "linear" or "chat".
  string source_kind = 2;
  string source_key = 3;
  string profile = 4;
  // playbook is fixed when the session is created: one session, one playbook.
  string playbook = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_turn_at = 7;
}

// Turn is one inbound message turned into one Podium task.
message Turn {
  string id = 1;
  string session_id = 2;
  // task_id is empty for the moment between the turn being recorded and the task being
  // created, and stays empty for a turn whose task could not be created at all.
  string task_id = 3;
  // trigger_ref is the source's own reference to the message that started this turn.
  string trigger_ref = 4;
  // status is running, succeeded, failed, lost, cancelled or timeout.
  string status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  // num_turns and cost_usd come from the runtime's turn.json and are unset until it lands.
  optional int32 num_turns = 8;
  optional double cost_usd = 9;
  // final_text is what the bot said, as it was relayed. It is content, never instructions.
  string final_text = 10;
}

// Page is the same cursor shape podium.v1 uses: an opaque cursor and a bounded limit.
message Page {
  int32 limit = 1;
  string cursor = 2;
}

message ListSessionsRequest {
  Page page = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  // Empty when there is no further page.
  string next_cursor = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListTurnsRequest {
  string session_id = 1;
  int32 limit = 2;
}

message ListTurnsResponse {
  repeated Turn turns = 1;
}

message GetSettingsRequest {}

// ProviderSettings is everything the UI may know about a stored provider credential.
// key_hint is the last four characters, computed once at save time: that is the only form
// in which any part of the credential is ever read back.
message ProviderSettings {
  // provider is "anthropic" or "xai". The field is the BYOK seam.
  string provider = 1;
  bool key_set = 2;
  // key_hint is the last four characters of the key, or "" when no key is set. It is empty
  // for an OAuth credential: an access token is not a thing to show four characters of.
  string key_hint = 3;
  // model is profile.yaml's model. Informational: the picker is ListAgents.
  string model = 4;
  // set_by is the X-Podium-Login at the time of SetProviderKey, or "unknown".
  string set_by = 5;
  google.protobuf.Timestamp set_at = 6;
  // auth_kind is "api_key" or "oauth", and "" when nothing is set. It is what the UI shows
  // instead of a hint for a subscription sign-in.
  string auth_kind = 7;
  // account is who the provider says is signed in — an email or a subject — for an OAuth
  // credential, and "" otherwise. It comes from the provider's own token response.
  string account = 8;
  // expires_at is when the stored access token stops working. Unset for an API key, which
  // does not expire. The conductor refreshes an OAuth token in the background well before
  // this, so a UI showing a time in the past means refreshing has been failing.
  google.protobuf.Timestamp expires_at = 9;
  // refreshable is true when a refresh token was issued, which is what makes an OAuth
  // credential survive its first hour without a human.
  bool refreshable = 10;
}

message GetSettingsResponse {
  // provider is the Anthropic row, kept for the clients that only ever knew about one.
  ProviderSettings provider = 1;
  // providers is every provider this conductor knows, Anthropic included, in a stable
  // order. New clients read this and ignore the field above.
  repeated ProviderSettings providers = 2;
}

message SetProviderKeyRequest {
  string provider = 1;
  // SENSITIVE: never log this field. The handler wraps the request in a redacting
  // slog.LogValuer so no log site has to remember.
  string key = 2;
}

message SetProviderKeyResponse {
  ProviderSettings provider = 1;
  // models is the ids the provider says this key can see, capped at 20. It exists so the UI
  // can show proof that the key works.
  repeated string models = 2;
  // status is a human sentence about the save, or "" when there is nothing to add.
  string status = 3;
}

// ProviderKeyError is the Connect error detail SetProviderKey attaches when it did not save
// a key, so the operator is told *why* and not only *that*. The status code still carries
// the classification — permission_denied when the provider refused, unavailable when it
// could not be asked — and this carries the sentence behind it.
message ProviderKeyError {
  // provider_message is the provider's own explanation of the refusal, or the transport
  // failure that stopped us asking it. It comes from the provider over TLS, NOT from a task
  // container: it is not the untrusted task output docs/security.md is about, which is why
  // it is shown rather than withheld. It is still bounded, whitespace-collapsed and scrubbed
  // of anything key-shaped by the conductor, and the browser renders it as text and never as
  // markup. Empty when there was nothing to say.
  string provider_message = 1;
}

message ClearProviderKeyRequest {
  string provider = 1;
}

message ClearProviderKeyResponse {}

message StartProviderOAuthRequest {
  // provider is "xai". Anthropic takes an API key on this control plane and answers
  // invalid_argument here.
  string provider = 1;
}

// StartProviderOAuthResponse is a device-authorisation grant (RFC 8628) in flight. It
// carries no credential: the device code itself stays on the conductor, keyed by flow_id,
// so a browser that is shown this response cannot complete the sign-in on its own.
message StartProviderOAuthResponse {
  // flow_id names this sign-in to PollProviderOAuth. It is opaque and single-use.
  string flow_id = 1;
  // user_code is what the human types on the provider's page. It is meant to be read out
  // loud, so it is shown as the provider formatted it, dashes included.
  string user_code = 2;
  // verification_uri is where the human goes.
  string verification_uri = 3;
  // verification_uri_complete has the code already in it, for a link or a QR code. Empty
  // when the provider did not offer one.
  string verification_uri_complete = 4;
  // interval is how many seconds to wait between polls. Poll faster and the provider
  // answers slow_down.
  int32 interval = 5;
  // expires_at is when the code stops being accepted and the flow has to be restarted.
  google.protobuf.Timestamp expires_at = 6;
}

message PollProviderOAuthRequest {
  string provider = 1;
  string flow_id = 2;
}

// PollProviderOAuthResponse says where the sign-in got to. Exactly one poll ends it: the
// one that comes back authorised is the one that stored the token.
message PollProviderOAuthResponse {
  // state is one of five. `pending` means the human has not finished yet, so poll again
  // after interval. `slow_down` means the polling is too fast and the interval in this
  // response is the new one. `done` means authorised and stored, and provider is filled in.
  // `denied` means the human said no, or the provider refused this client. `expired` means
  // the code timed out and the sign-in has to be started again.
  string state = 1;
  // interval is the seconds to wait before the next poll. Only meaningful while pending.
  int32 interval = 2;
  // provider is the stored credential, set only when state is done.
  ProviderSettings provider = 3;
  // detail is the provider's own sentence about a denied or expired flow, bounded and
  // scrubbed exactly as ProviderKeyError.provider_message is. Empty when there is nothing
  // to add.
  string detail = 4;
}

// AgentModel is one model a backend offers, as the picker shows it.
message AgentModel {
  string id = 1;
  string display_name = 2;
  // note is the one line under the name in the picker: what this model is for.
  string note = 3;
  // context_tokens is the model's context window, or 0 when it is not known here.
  int32 context_tokens = 4;
  // efforts are the reasoning-effort levels this model accepts, weakest first. Empty means
  // the model takes no effort setting and the control is hidden for it.
  repeated string efforts = 5;
}

// AgentBackend is one thing a turn can run on: a harness, the credential it needs, and the
// models it can be pointed at.
message AgentBackend {
  // id is what a playbook's `agent` field holds: "claude" or "grok".
  string id = 1;
  string display_name = 2;
  // provider is the credential this backend spends: "anthropic" or "xai".
  string provider = 3;
  // note is a sentence about what this backend actually is, for the picker's header.
  string note = 4;
  string default_model = 5;
  repeated AgentModel models = 6;
  // ready is true when this control plane holds a credential for the backend. A playbook may
  // still be saved against a backend that is not ready — the operator may be setting it up
  // in either order — and the UI says so rather than refusing.
  bool ready = 7;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentBackend agents = 1;
  // default_agent is what a profile that names no agent runs on.
  string default_agent = 2;
}

// Memory is one thing the organisation remembers, shared by every agent turn.
//
// EVERY FIELD IS CONTENT. A memory was written by a task, out of material a human, a
// repository or a ticket supplied; nothing in Podium interprets it. The provenance fields
// exist so a person can tell where a memory came from and forget one that should not be
// there — which is the only defence there is against a turn planting a false memory.
message Memory {
  string id = 1;
  string text = 2;
  // fact_type is world, experience or observation. An observation is derived by the memory
  // engine from the facts under it.
  string fact_type = 3;
  // tags are recorded by the conductor (source:<kind>, playbook:<name>) and never filtered on.
  repeated string tags = 4;
  // metadata is the provenance the conductor set: session_id, turn_id, task_id, source_ref
  // and source_url.
  map<string, string> metadata = 5;
  // created_at is when the memory was learned.
  google.protobuf.Timestamp created_at = 6;
  // entities are the people, systems and concepts the memory engine linked this to.
  repeated string entities = 7;
  // context is the retaining caller's note about where the memory came from.
  string context = 8;
  // document_id is what the retainer grouped the memory under: the turn id, for anything
  // the conductor retained.
  string document_id = 9;
}

message ListMemoriesRequest {
  // cursor is opaque and comes from a previous response.
  string cursor = 1;
  int32 limit = 2;
}

message ListMemoriesResponse {
  repeated Memory items = 1;
  // Empty when there is no further page.
  string next_cursor = 2;
}

message SearchMemoriesRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchMemoriesResponse {
  repeated Memory items = 1;
}

message DeleteMemoryRequest {
  string id = 1;
}

message DeleteMemoryResponse {}

// Playbook is one job the bot can do, as much of it as a browser needs to offer the choice.
message Playbook {
  string name = 1;
  // image is the runtime image a turn of this playbook runs. Shown so a human can tell the
  // data playbook from the browser one.
  string image = 2;
  // hint is the first line of the playbook's prompt, capped. It is a description, not a
  // contract: the prompt is the operator's own file.
  string hint = 3;
  // chat_default is true for the playbook a new chat message uses when nothing else picks one.
  bool chat_default = 4;
  // agent, model and effort are what a turn of this playbook runs on with no override:
  // RESOLVED, so the playbook's own value or the profile's, never empty for agent and model.
  // The composer shows them as what "the playbook's" means before anything is picked.
  string agent = 5;
  string model = 6;
  // effort is empty when neither the playbook nor the profile names one, which means the
  // model's own default.
  string effort = 7;
}

message ListPlaybooksRequest {}

message ListPlaybooksResponse {
  repeated Playbook playbooks = 1;
  // profile_display_name labels the bot's own messages in the chat.
  string profile_display_name = 2;
}

// Chat is one web-chat conversation. EVERY message in it is content: a human wrote the user
// turns and a task wrote the assistant ones, and nothing in Podium interprets either.
message Chat {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  // last_message_at is unset for a chat nobody has spoken in yet.
  google.protobuf.Timestamp last_message_at = 4;
  // preview is the first 80 characters of the last message, for the chat list.
  string preview = 5;
  // turn_running is true while a turn of this chat is in flight, which is when the
  // composer is disabled and SendChatMessage answers FailedPrecondition.
  bool turn_running = 6;
}

// ChatAttachment is a file a turn produced, resolved to the artifact it actually is. The id
// is what the browser downloads through GET /artifacts/{id}; the name alone would be
// ambiguous the moment two turns produce a report.csv.
message ChatAttachment {
  string artifact_id = 1;
  string name = 2;
  string content_type = 3;
  int64 size_bytes = 4;
}

// ChatMessage is one stored turn of a conversation. seq is per chat and monotonic, which is
// what makes replay-then-follow exactly once.
message ChatMessage {
  string chat_id = 1;
  uint64 seq = 2;
  // role is "user" or "assistant".
  string role = 3;
  string text = 4;
  repeated ChatAttachment attachments = 5;
  google.protobuf.Timestamp ts = 6;
}

// ChatStatus is a turn's state, pushed to whoever is watching. It is never stored: a reload
// re-derives it from Chat.turn_running.
message ChatStatus {
  // state is started, finished or failed.
  string state = 1;
  string task_id = 2;
}

// ChatFrame is one thing that happened in a chat.
//
// A message frame is durable and may repeat with the same seq when its attachments are
// resolved after the fact — a client keyed on seq replaces rather than appends. A progress
// frame is ephemeral: it is shown while a turn runs and is never stored, so a reload does
// not show it. A resync frame means this subscriber fell behind and dropped something
// durable: re-read from the last seq seen.
message ChatFrame {
  oneof frame {
    ChatMessage message = 1;
    string progress = 2;
    ChatStatus status = 3;
    bool resync = 4;
  }
}

message CreateChatRequest {
  // title is optional; an empty one becomes "New chat".
  string title = 1;
}

message CreateChatResponse {
  Chat chat = 1;
}

message ListChatsRequest {
  Page page = 1;
}

message ListChatsResponse {
  repeated Chat chats = 1;
  // Empty when there is no further page.
  string next_cursor = 2;
}

message SendChatMessageRequest {
  string chat_id = 1;
  string text = 2;
  // playbook names the playbook this message runs and wins over everything else, a leading
  // /playbook in the text included: a human picking the chip after typing is the later
  // intent. Empty leaves the choice to a leading /playbook in the text, then to
  // profile.yaml's chat_default_playbook, then to its default_playbook. An unknown /name is
  // not a playbook selector: it stays in the text.
  string playbook = 3;
  // agent, model and effort override what the playbook runs on, for THIS message only.
  //
  // They exist so that "which job" and "what runs it" are two choices instead of one. A
  // playbook's own values are a default, not a fixture: without this, the only way to ask the
  // same playbook on a different model is a second playbook that differs by one field, and a
  // profile fills up with near-duplicates.
  //
  // Empty means the playbook's, then the profile's. The three are validated together against
  // the same catalogue a playbook is, so a level the chosen model does not accept is refused
  // here rather than failing the turn.
  string agent = 4;
  string model = 5;
  string effort = 6;
}

message SendChatMessageResponse {
  // message is the stored human message, with the seq it was given.
  ChatMessage message = 1;
}

message StreamChatRequest {
  string chat_id = 1;
  // from_seq is exclusive: everything with a higher seq is replayed before the stream
  // starts following. 0 replays the whole conversation.
  uint64 from_seq = 2;
}

// AgentProfile is the bot's identity as the management screen sees it: what is in force
// now, and what profile.yaml said, so the UI can show which fields a browser has overridden
// and offer the file's value back.
message AgentProfile {
  // name is profile.yaml's and is never overridable: it labels every session row already
  // written.
  string name = 1;
  string display_name = 2;
  string model = 3;
  string default_playbook = 4;
  // chat_default_playbook is the playbook a web chat starts with. Empty means default_playbook.
  string chat_default_playbook = 5;
  // profile_dir is where the file half was read from, so an operator editing YAML knows
  // which directory this process actually loaded.
  string profile_dir = 6;
  // The file_* fields are profile.yaml verbatim, whatever is overriding them.
  string file_display_name = 7;
  string file_model = 8;
  string file_default_playbook = 9;
  string file_chat_default_playbook = 10;
  // overridden names the fields a stored override is currently supplying, by their
  // profile.yaml key: display_name, model, default_playbook, chat_default_playbook, agent,
  // effort.
  repeated string overridden = 11;
  // updated_by and updated_at describe the stored override, not the file.
  string updated_by = 12;
  google.protobuf.Timestamp updated_at = 13;
  // agent is the backend every playbook runs on unless it names its own: "claude" or "grok".
  string agent = 14;
  // effort is the reasoning effort every playbook runs at unless it names its own. Empty
  // means the model's own default.
  string effort = 15;
  string file_agent = 16;
  string file_effort = 17;
}

// PlaybookResources caps a turn's container. It is spec.Resources, which is where it ends up.
message PlaybookResources {
  double cpu = 1;
  int32 memory_mb = 2;
  int32 pids = 3;
}

// PlaybookSecretRef names a stored secret and says where the turn wants it. It carries the
// NAME of a value and never a value: a secret's value cannot be read back out of Podium at
// all, and nothing in this API is an exception.
message PlaybookSecretRef {
  string name = 1;
  // target is "env" or "file". Empty defaults to "env".
  string target = 2;
  // key is the environment variable name, or the absolute path for a file target.
  string key = 3;
}

// PlaybookRepo is a repository a turn of this playbook gets cloned into /workspace.
message PlaybookRepo {
  string name = 1;
  string url = 2;
  string default_branch = 3;
}

// PlaybookDefinition is one playbook in full: everything playbooks/<name>.yaml holds, plus where
// this copy came from and whether a browser may change it.
message PlaybookDefinition {
  string name = 1;
  // image is the runtime image a turn of this playbook runs. It is free text the operator
  // supplies; it has to implement the turn-brief protocol, and FROM podium-agent-runtime
  // is the easy way to get one that does.
  string image = 2;
  string system_prompt = 3;
  repeated string allowed_tools = 4;
  int32 max_turns = 5;
  // timeout is a duration string ("30m"). Empty means the default.
  string timeout = 6;
  // model is empty for "whatever the profile says".
  string model = 7;
  repeated string labels = 8;
  PlaybookResources resources = 9;
  repeated PlaybookSecretRef secrets = 10;
  repeated PlaybookRepo repos = 11;
  repeated string slack_channels = 12;
  bool linear = 13;
  map<string, string> env = 14;
  // origin is "file" for a playbooks/<name>.yaml on the conductor's host and "stored" for one
  // created through this API.
  string origin = 15;
  // editable is false for a file playbook: the files are authoritative for the names they
  // hold and the write RPCs refuse one.
  bool editable = 16;
  // shadowed is true for a stored playbook whose name a file playbook also defines. The file
  // wins, so a shadowed playbook never runs; it is reported so it can be deleted.
  bool shadowed = 17;
  // updated_by and updated_at are set for a stored playbook only.
  string updated_by = 18;
  google.protobuf.Timestamp updated_at = 19;
  // agent is the backend a turn of this playbook runs on: "claude", "grok", or empty for
  // whatever the profile says.
  string agent = 20;
  // effort is the reasoning effort a turn of this playbook runs at, or empty for the
  // profile's. The levels a model accepts come from ListAgents.
  string effort = 21;
}

message GetProfileRequest {}

message GetProfileResponse {
  AgentProfile profile = 1;
  // playbooks is every playbook that runs, sorted by name, followed by any shadowed stored
  // playbook. Two entries can share a name when one is shadowed; they differ in origin.
  repeated PlaybookDefinition playbooks = 2;
  // stale_reason is set when what the database holds could not be merged into a valid
  // profile, so the conductor is still running the last one that could. Empty normally.
  string stale_reason = 3;
}

message UpdateProfileRequest {
  // Every field is an override of profile.yaml. An empty one clears the override, which
  // returns that field to the file's value.
  string display_name = 1;
  string model = 2;
  string default_playbook = 3;
  string chat_default_playbook = 4;
  string agent = 5;
  string effort = 6;
}

message UpdateProfileResponse {
  AgentProfile profile = 1;
}

message CreatePlaybookRequest {
  PlaybookDefinition playbook = 1;
}

message CreatePlaybookResponse {
  PlaybookDefinition playbook = 1;
}

message UpdatePlaybookRequest {
  // playbook.name names the playbook to replace.
  PlaybookDefinition playbook = 1;
}

message UpdatePlaybookResponse {
  PlaybookDefinition playbook = 1;
}

message DeletePlaybookRequest {
  string name = 1;
}

message DeletePlaybookResponse {}
