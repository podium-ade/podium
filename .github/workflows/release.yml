name: release

# A v* tag is the only thing that publishes anything. Everything else — including a push to
# main — goes through ci.yml, which builds the same artifacts and throws them away.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # STOP. Podium has no licence yet.
  #
  # LICENSE contains a placeholder that says so. Publishing archives and container
  # images of code that carries no licence gives nobody the right to use it and
  # cannot be undone by editing the file afterwards — the tag, the release and every
  # copy anyone pulled are already out there.
  #
  # This job gates every other job in this workflow. Choosing the licence is the
  # only way past it, and it is deliberately a decision a human makes.
  # ===========================================================================
  license:
    name: LICENSE must not be a TODO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Refuse to release unlicensed code
        run: |
          if grep -qi 'TODO' LICENSE; then
            echo "::error file=LICENSE::LICENSE still contains a TODO placeholder."
            cat <<'MSG'

          ============================================================
           RELEASE REFUSED: Podium has no licence.
          ============================================================

          LICENSE currently reads:

          MSG
            sed 's/^/    /' LICENSE
            cat <<'MSG'

          Nothing is published until a real licence text is in that file.
          Choose one — Apache-2.0 and AGPL-3.0 are the two this project has been
          weighing since step 01 — put the full text in LICENSE, add the SPDX
          identifier to README.md, delete the tag, and tag again.

          Until then every artifact this workflow would produce is code that
          nobody has the right to use, and republishing under a licence later
          does not retract what was already downloaded.
          ============================================================
          MSG
            exit 1
          fi
          echo "LICENSE looks like a real licence. Proceeding."

  release:
    name: goreleaser
    needs: [license]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      packages: write # push images to ghcr.io
      id-token: write # cosign keyless signing needs the OIDC token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the changelog is generated from history

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # `make web` is a goreleaser before-hook and the server binary embeds web/dist, so a
      # release built without Node would ship a control plane with no UI.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Multi-arch images: qemu emulates the other architecture, buildx drives the build.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # syft produces the SBOMs, cosign signs checksums.txt and the image manifests. Both
      # have to be on PATH before goreleaser runs; goreleaser shells out to them by name.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Only install the binary; the SBOMs themselves are goreleaser's job.
          version: v1.51.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1

      # podium-agent (the conductor) is built and its image published by the `agent` entry in
      # .goreleaser.yaml, alongside the server, the node and the CLI. It is deliberately NOT in
      # the release archive: an operator untars a release to set up a worker, and the conductor
      # runs on the control plane's host from its image.
      #
      # podium-agent-runtime is NOT built here. It builds from agent/runtime rather than from
      # a Go binary, and its Dockerfile's COPY paths are relative to that directory, which
      # goreleaser's extra_files cannot reproduce — extra_files keeps paths relative to the
      # project root. It gets its own job below instead.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keyless signing: cosign reads the workflow's OIDC identity, so the signature
          # names this repository and this workflow rather than a key somebody holds.
          COSIGN_EXPERIMENTAL: "1"

  # ===========================================================================
  # podium-agent-runtime — the image an agent turn runs in.
  #
  # Its own job, not a goreleaser entry, because it builds from agent/runtime as its context
  # and its Dockerfile COPYs package.json / src relative to that directory. goreleaser's
  # extra_files stages paths relative to the PROJECT ROOT, so the COPYs would not resolve
  # without either duplicating the Dockerfile or making the whole repo the build context.
  # buildx with the right context is simpler and honest.
  #
  # -dev is published too, by the job below. It layers on this image (ARG RUNTIME_IMAGE), so
  # it cannot be a matrix leg or a second platform here: it has to be a job that runs AFTER
  # this one and is handed the pushed base by digest. That is what `outputs` is for.
  # ===========================================================================
  agent-runtime:
    name: podium-agent-runtime
    needs: [license]
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    # What agent-runtime-dev builds FROM. The digest and not a tag: the dev image must layer
    # on the bytes this job just pushed, not on whatever that tag resolves to by the time the
    # next job starts.
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The tag set has to match the Go images exactly, or a version-matched default cannot
      # find its runtime. `latest` moves only on a real release, like every other image:
      # a prerelease tag carries a `-`, which is the whole test.
      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"          # v0.1.0, or v0.1.0-rc.1
          version="${ref#v}"
          major_minor="v$(echo "$version" | cut -d. -f1-2)"
          image=ghcr.io/${{ github.repository_owner }}/podium-agent-runtime
          tags="$image:$version,$image:$major_minor,$image:sha-${GITHUB_SHA::7}"
          case "$version" in
            *-*) echo "prerelease: not moving :latest" ;;
            *)   tags="$tags,$image:latest" ;;
          esac
          echo "image=$image"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags"       >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The three toolchains this image installs are already per-arch pinned in the
      # Dockerfile, so amd64 + arm64 under qemu needs no extra build-args, only patience.
      # sbom and provenance are attached as OCI attestations, which is this image's
      # equivalent of the `sbom: true` the goreleaser entries carry.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent/runtime
          file: agent/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1

      # The manifest is what a node pulls, so the digest is what is signed — the same choice
      # `docker_signs` makes for the Go images.
      - name: Sign the manifest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"

  # ===========================================================================
  # podium-agent-runtime-dev — the base runtime plus a toolchain that can build, test and lint
  # a Go + pnpm project, for a playbook whose job is to CHANGE a repository rather than answer
  # a question about one. profile/playbooks/podium.yaml is that playbook, and profile/README.md is
  # how a Podium developer points their own deployment at it.
  #
  # Published because a playbook is only as portable as its image. `make agent-runtime` builds
  # this locally, and a locally built tag is visible to exactly one machine — so a developer
  # handed the dev kit would otherwise have to build ~1.7 GB per architecture on every node
  # before the playbook could be scheduled anywhere.
  #
  # It is a SEPARATE JOB and not a second `docker/build-push-action` step in the job above,
  # because `FROM ${RUNTIME_IMAGE}` has to resolve to the base this release just pushed. Its
  # digest only exists once that job has finished, and `needs:` is the only thing that
  # expresses "after, with the result".
  # ===========================================================================
  agent-runtime-dev:
    name: podium-agent-runtime-dev
    needs: [agent-runtime]
    runs-on: ubuntu-latest
    # Two architectures of a Go toolchain, a Docker client, golangci-lint and two global npm
    # packages, one of them under qemu. It is the slowest thing this workflow builds; the
    # ceiling is here so a hung download fails the release rather than burning six hours.
    timeout-minutes: 120
    permissions:
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The same tag set as the base, computed the same way: a version-matched dev image is
      # the only kind worth publishing, since its toolchain is pinned to what this commit of
      # the repository builds with. `latest` moves only on a real release — a prerelease tag
      # carries a `-`, which is the whole test.
      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"          # v0.1.0, or v0.1.0-rc.1
          version="${ref#v}"
          major_minor="v$(echo "$version" | cut -d. -f1-2)"
          image=ghcr.io/${{ github.repository_owner }}/podium-agent-runtime-dev
          tags="$image:$version,$image:$major_minor,$image:sha-${GITHUB_SHA::7}"
          case "$version" in
            *-*) echo "prerelease: not moving :latest" ;;
            *)   tags="$tags,$image:latest" ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags"   >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RUNTIME_IMAGE is the whole reason this job exists. Pinning the base by digest means the
      # published dev image is this release's runtime with a toolchain on top, and cannot
      # silently become "whatever :latest was" if a later release lands mid-build.
      #
      # Every version the Dockerfile installs is already pinned in it, per architecture, so
      # amd64 + arm64 under qemu needs no extra build-args — only patience.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent/runtime
          file: agent/runtime/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNTIME_IMAGE=${{ needs.agent-runtime.outputs.image }}@${{ needs.agent-runtime.outputs.digest }}
            VERSION=${{ needs.agent-runtime.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.agent-runtime.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1

      - name: Sign the manifest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"
