name: release

# Every merge to main is a release. The push to main starts this workflow, the version is worked
# out here rather than typed in, the first job that leaves a mark tags main, and every job after
# it builds and publishes from that tag.
#
# The version is the latest stable v* tag, bumped. How far is decided by the pull request that
# produced the push — the first match wins:
#
#   1. a version in its title, `[RELEASE] 0.9.0` — the old convention, still honoured as an override
#   2. a `release:major`, `release:minor` or `release:patch` label
#   3. otherwise a patch bump
#
# A `release:skip` label, or `[skip release]` in the head commit's message, merges without
# releasing. (`[skip ci]` does too, because GitHub then starts no workflow at all.)
#
# workflow_dispatch is still here for the cases a merge does not cover — a prerelease, or
# re-releasing after a skipped merge. Its version is optional; left empty, it bumps like a merge.
#
# The tag is created BY this workflow, never pushed to START it, so one release is one run, a
# tag pushed by hand publishes nothing, and GITHUB_TOKEN is enough to push it because nothing is
# waiting on the push event. Everything that is not a release still goes through ci.yml, which
# builds the same artifacts and throws them away.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v — 0.2.4, or 0.2.4-rc.1. Empty: bump like a merge would."
        required: false
        type: string
      bump:
        description: "When version is empty: how far to bump the latest release."
        required: false
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

# One release at a time. Two runs racing to tag is a confusing way to learn which won. A merge
# that lands while a release is in flight waits for it, so it bumps from the tag that run made.
# (GitHub keeps one pending run per group: three merges inside one release window become two
# releases, the second carrying both later merges. Nothing is lost, only coalesced.)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # The tag. The first job that leaves a mark, and what everything below builds from.
  #
  # It runs BEFORE anything is published, because a tag is public the moment it is pushed and
  # deleting it does not un-fetch it, so every check that can refuse a release happens here.
  #
  # It tags github.sha — the commit this run was dispatched against — and not whatever main
  # points at by now, so the tag, the sha-* image tags and the code in the artifacts are all
  # one commit.
  # ===========================================================================
  tag:
    name: tag main
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the tag
      pull-requests: read # read the merged PR's title and labels to choose the bump
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # workflow_dispatch can be started against any branch. A release comes off main, and a
      # tag pointing at code that was never merged is the mistake worth catching here. (A push
      # run is main by construction.)
      - name: Refuse to release anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release is cut from main. This run was started on ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # every existing tag, so a duplicate is caught before it is made

      - name: Work out the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

          # A re-run of a release whose tag already went out reuses that tag rather than
          # minting a second version for the same commit.
          existing=$(git tag --points-at HEAD --list 'v*' | grep -E "^v${semver#^}" | head -1 || true)
          if [ -n "$existing" ]; then
            echo "\`$(git rev-parse --short HEAD)\` is already \`${existing}\`; publishing that." >> "$GITHUB_STEP_SUMMARY"
            echo "release=true"           >> "$GITHUB_OUTPUT"
            echo "version=${existing#v}"  >> "$GITHUB_OUTPUT"
            echo "tag=${existing}"        >> "$GITHUB_OUTPUT"
            echo "push=false"             >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${INPUT_VERSION#v}"   # a leading v is forgiven rather than refused
          bump="${INPUT_BUMP:-patch}"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if printf '%s' "$HEAD_MESSAGE" | grep -qiF '[skip release]'; then
              echo "Head commit says \`[skip release]\`. Not releasing." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # The pull request this push merged. A direct push to main has none, and bumps patch.
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                   --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
            if [ -n "$pr" ]; then
              title=$(jq -r .title <<<"$pr")
              labels=$(jq -r '.labels[].name' <<<"$pr")
              echo "Merged #$(jq -r .number <<<"$pr"): ${title}"
              if grep -qx 'release:skip' <<<"$labels"; then
                echo "#$(jq -r .number <<<"$pr") is labelled \`release:skip\`. Not releasing." >> "$GITHUB_STEP_SUMMARY"
                echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              titled=$(sed -nE 's/.*\[RELEASE\][[:space:]]*v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?).*/\1/p' <<<"$title")
              if   [ -n "$titled" ];                      then version="$titled"
              elif grep -qx 'release:major' <<<"$labels"; then bump=major
              elif grep -qx 'release:minor' <<<"$labels"; then bump=minor
              elif grep -qx 'release:patch' <<<"$labels"; then bump=patch
              fi
            else
              echo "No merged pull request for ${GITHUB_SHA::7}; bumping ${bump}."
            fi
          fi

          if [ -z "$version" ]; then
            # The latest STABLE release. A prerelease is never the base: after 0.9.0-rc.1, a
            # patch bump of 0.8.2 is 0.8.3, and 0.9.0 is reached with a minor bump.
            latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            IFS=. read -r major minor patch <<<"${latest#v}"
            major=${major:-0} minor=${minor:-0} patch=${patch:-0}
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              *)     version="${major}.${minor}.$((patch + 1))" ;;
            esac
            echo "Latest release ${latest:-none}, ${bump} bump → ${version}"
          fi

          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "::error::'${version}' is not a version. Expected 0.2.4, or 0.2.4-rc.1."
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists. A tag is what was published; it is not re-cut."
            exit 1
          fi
          echo "release=true"       >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"
          echo "push=true"          >> "$GITHUB_OUTPUT"

      - name: Tag main
        if: steps.v.outputs.release == 'true' && steps.v.outputs.push == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"
          echo "Tagged \`$(git rev-parse --short HEAD)\` as \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: goreleaser
    # agent-runtime too, and not just for ordering's sake: the agent image now builds FROM
    # the runtime image by digest, so the runtime has to exist before goreleaser builds the
    # conductor. This serialises the two halves of a release that used to run side by side.
    needs: [tag, agent-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      packages: write # push images to ghcr.io
      id-token: write # cosign keyless signing needs the OIDC token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag, not main: goreleaser reads the version off the checked-out ref, and
          # main may have moved since this run started.
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0 # the changelog is generated from history

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # `make web` is a goreleaser before-hook and the server binary embeds web/dist, so a
      # release built without Node would ship a control plane with no UI.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Multi-arch images: qemu emulates the other architecture, buildx drives the build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # syft produces the SBOMs, cosign signs checksums.txt and the image manifests. Both
      # have to be on PATH before goreleaser runs; goreleaser shells out to them by name.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Only install the binary; the SBOMs themselves are goreleaser's job.
          version: v1.51.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1

      # podium-agent (the conductor) is built and its image published by the `agent` entry in
      # .goreleaser.yaml, alongside the server, the node and the CLI. It is deliberately NOT in
      # the release archive: an operator untars a release to set up a worker, and the conductor
      # runs on the control plane's host from its image.
      #
      # podium-agent-runtime is NOT built here. It builds from agent/runtime rather than from
      # a Go binary, and its Dockerfile's COPY paths are relative to that directory, which
      # goreleaser's extra_files cannot reproduce — extra_files keeps paths relative to the
      # project root. It gets its own job below instead.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keyless signing: cosign reads the workflow's OIDC identity, so the signature
          # names this repository and this workflow rather than a key somebody holds.
          COSIGN_EXPERIMENTAL: "1"
          # The runtime the agent image layers on. By DIGEST, not by tag: the conductor has
          # to carry the bytes this release's agent-runtime job pushed, not whatever the tag
          # resolves to by now. .goreleaser.yaml reads it as the RUNTIME_IMAGE build arg, and
          # goreleaser fails the build if it is unset rather than shipping a stale runtime.
          PODIUM_RUNTIME_IMAGE: ${{ needs.agent-runtime.outputs.image }}@${{ needs.agent-runtime.outputs.digest }}

  # ===========================================================================
  # podium-agent-runtime — the image an agent turn runs in.
  #
  # Its own job, not a goreleaser entry, because it builds from agent/runtime as its context
  # and its Dockerfile COPYs package.json / src relative to that directory. goreleaser's
  # extra_files stages paths relative to the PROJECT ROOT, so the COPYs would not resolve
  # without either duplicating the Dockerfile or making the whole repo the build context.
  # buildx with the right context is simpler and honest.
  #
  # -dev is published too, by the job below. It layers on this image (ARG RUNTIME_IMAGE), so
  # it cannot be a matrix leg or a second platform here: it has to be a job that runs AFTER
  # this one and is handed the pushed base by digest. That is what `outputs` is for.
  # ===========================================================================
  agent-runtime:
    name: podium-agent-runtime
    needs: [tag]
    # A skipped release stops here; goreleaser and -dev both need this job, so they skip too.
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    # What agent-runtime-dev builds FROM. The digest and not a tag: the dev image must layer
    # on the bytes this job just pushed, not on whatever that tag resolves to by the time the
    # next job starts.
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      # The tag set has to match the Go images exactly, or a version-matched default cannot
      # find its runtime. `latest` moves only on a real release, like every other image:
      # a prerelease tag carries a `-`, which is the whole test.
      - name: Work out the tags
        id: tags
        env:
          # The version the run was given, not the ref: this workflow is dispatched on main
          # and GITHUB_REF_NAME would read "main".
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"      # 0.1.0, or 0.1.0-rc.1
          major_minor="v$(echo "$version" | cut -d. -f1-2)"
          image=ghcr.io/${{ github.repository_owner }}/podium-agent-runtime
          tags="$image:$version,$image:$major_minor,$image:sha-${GITHUB_SHA::7}"
          case "$version" in
            *-*) echo "prerelease: not moving :latest" ;;
            *)   tags="$tags,$image:latest" ;;
          esac
          echo "image=$image"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags"       >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The three toolchains this image installs are already per-arch pinned in the
      # Dockerfile, so amd64 + arm64 under qemu needs no extra build-args, only patience.
      # sbom and provenance are attached as OCI attestations, which is this image's
      # equivalent of the `sbom: true` the goreleaser entries carry.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: agent/runtime
          file: agent/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1

      # The manifest is what a node pulls, so the digest is what is signed — the same choice
      # `docker_signs` makes for the Go images.
      - name: Sign the manifest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"

  # ===========================================================================
  # podium-agent-runtime-dev — the base runtime plus a toolchain that can build, test and lint
  # a Go + pnpm project, for a playbook whose job is to CHANGE a repository rather than answer
  # a question about one. profile/playbooks/podium.yaml is that playbook, and profile/README.md is
  # how a Podium developer points their own deployment at it.
  #
  # Published because a playbook is only as portable as its image. `make agent-runtime` builds
  # this locally, and a locally built tag is visible to exactly one machine — so a developer
  # handed the dev kit would otherwise have to build ~1.7 GB per architecture on every node
  # before the playbook could be scheduled anywhere.
  #
  # It is a SEPARATE JOB and not a second `docker/build-push-action` step in the job above,
  # because `FROM ${RUNTIME_IMAGE}` has to resolve to the base this release just pushed. Its
  # digest only exists once that job has finished, and `needs:` is the only thing that
  # expresses "after, with the result".
  # ===========================================================================
  agent-runtime-dev:
    name: podium-agent-runtime-dev
    needs: [tag, agent-runtime]
    runs-on: ubuntu-latest
    # Two architectures of a Go toolchain, a Docker client, golangci-lint and two global npm
    # packages, one of them under qemu. It is the slowest thing this workflow builds; the
    # ceiling is here so a hung download fails the release rather than burning six hours.
    timeout-minutes: 120
    permissions:
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      # The same tag set as the base, computed the same way: a version-matched dev image is
      # the only kind worth publishing, since its toolchain is pinned to what this commit of
      # the repository builds with. `latest` moves only on a real release — a prerelease tag
      # carries a `-`, which is the whole test.
      - name: Work out the tags
        id: tags
        env:
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"      # 0.1.0, or 0.1.0-rc.1
          major_minor="v$(echo "$version" | cut -d. -f1-2)"
          image=ghcr.io/${{ github.repository_owner }}/podium-agent-runtime-dev
          tags="$image:$version,$image:$major_minor,$image:sha-${GITHUB_SHA::7}"
          case "$version" in
            *-*) echo "prerelease: not moving :latest" ;;
            *)   tags="$tags,$image:latest" ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags"   >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RUNTIME_IMAGE is the whole reason this job exists. Pinning the base by digest means the
      # published dev image is this release's runtime with a toolchain on top, and cannot
      # silently become "whatever :latest was" if a later release lands mid-build.
      #
      # Every version the Dockerfile installs is already pinned in it, per architecture, so
      # amd64 + arm64 under qemu needs no extra build-args — only patience.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: agent/runtime
          file: agent/runtime/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNTIME_IMAGE=${{ needs.agent-runtime.outputs.image }}@${{ needs.agent-runtime.outputs.digest }}
            VERSION=${{ needs.agent-runtime.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.agent-runtime.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.1

      - name: Sign the manifest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"
