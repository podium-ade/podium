name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: buf lint / breaking / generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - run: make proto-lint
      - name: Breaking-change check
        run: make proto-breaking
      # protoc-gen-es (Connect-ES v2 has no protoc-gen-connect-es) comes from web/node_modules,
      # which `make proto` installs; the TS half of the client is committed just like the Go half.
      - name: Generated code is up to date
        run: |
          make proto
          git diff --exit-code -- internal/proto web/src/gen

  build:
    name: lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      # `make build` depends on `make web`, so this job needs Node. The Go-only path is covered
      # by the noui step below, which is what a contributor without pnpm gets.
      - run: make lint test build
      - name: Go-only build (no UI)
        run: go build -tags noui ./...

  web:
    name: web lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration

  # The same artifacts release.yml produces, built and thrown away. It is here so that a
  # broken .goreleaser.yaml is found on the commit that broke it rather than on the tag.
  # Images are deliberately not built: that needs qemu, buildx and a registry login, and
  # none of it can be verified without pushing.
  snapshot:
    name: release snapshot (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `make web` is a goreleaser before-hook: the server binary embeds web/dist.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Podium has no licence yet. This is a warning here and a hard failure in
      # release.yml, so the state is visible on every push without blocking development.
      - name: LICENSE placeholder check
        run: |
          if grep -qi 'TODO' LICENSE; then
            echo "::warning file=LICENSE::LICENSE is still a TODO placeholder. \
          release.yml refuses to publish until a real licence is chosen."
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,publish,sign,sbom
      - name: Artifact listing
        run: ls -la dist/ && cat dist/checksums.txt
