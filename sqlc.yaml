version: "2"
sql:
  - engine: postgresql
    schema: internal/server/store/migrations
    queries: internal/server/store/queries
    gen:
      go:
        package: db
        out: internal/server/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        # pgtype.Timestamptz leaks pgx into every store signature; plain time.Time
        # (pointer when the column is nullable) is what the rest of the tree wants.
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
  # The conductor's own database. Same engine, same options, a different schema entirely:
  # internal/agent never opens the control plane's database and internal/server never opens
  # this one.
  - engine: postgresql
    schema: internal/agent/store/migrations
    queries: internal/agent/store/queries
    gen:
      go:
        package: agentdb
        out: internal/agent/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # numeric(12,6) would otherwise arrive as pgtype.Numeric, which leaks pgx into
          # every turn signature for a number the runtime reports as a float.
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
