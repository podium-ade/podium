# Podium's own bot. This directory is what PODIUM_AGENT_PROFILE_DIR points at on the real
# deployment, and the skills those playbooks name live in ../skills.
#
# It is NOT the worked example. examples/agent is that, and it is deliberately somewhere
# else: this profile clones this repository, holds a GitHub token, wants a privileged node
# and a browser, and none of that belongs in the first thing a reader copies. See
# docs/agent.md#the-profile-directory.
#
# Everything down to `agent` is the ASSISTANT: the turn that answers a conversation, here in
# the conductor's own process, with three tools and no container. `default_playbook` is a
# different decision — which playbook a Slack mention or a Linear ticket runs as a task.
name: podium
display_name: Podium
system_prompt: file:./prompts/profile.md
model: claude-opus-5
# The backend it answers on, and the default a playbook inherits. `podium` names grok.
agent: claude
# The assistant names no Agent Skills and no step cap: it delegates anything that needs a
# machine, so a skill installed beside it would have nothing to act on, and a cap firing
# mid-answer would cut off a conversation whose task was still working. `max_turns` here
# would set one; unset is no cap, which is the opposite of a playbook's default.
#
# A mention with no /playbook runs `general`, which answers questions and costs a container.
# `podium` is the dogfood — two hours, 200 turns, a Docker daemon, a browser and a privileged
# node — and a human asks for it by name. Neither is what the web chat runs: a conversation
# is answered above, and these two are what it delegates to.
default_playbook: general
