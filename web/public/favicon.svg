<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark tile in a light browser, inverted in a dark one, so it never melts into the tab bar. -->
  <style>
    .ground { fill: #181b1f; }
    .figure { fill: #f2f4f6; }
    .prompt { fill: none; stroke: #181b1f; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #f2f4f6; }
      .figure { fill: #181b1f; }
      .prompt { stroke: #f2f4f6; }
    }
  </style>
  <rect class="ground" width="64" height="64" rx="8"/>
  <rect class="figure" x="20" y="12" width="24" height="4" rx="2" opacity=".45"/>
  <rect class="figure" x="16" y="18" width="32" height="4" rx="2" opacity=".7"/>
  <rect class="figure" x="12" y="24" width="40" height="28" rx="4"/>
  <path class="prompt" d="M18.4 33l6 5-6 5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="ground">
    <rect x="28.8" y="38.5" width="5" height="4.5" rx="1.2"/>
    <rect x="35.4" y="38.5" width="5" height="4.5" rx="1.2" opacity=".6"/>
    <rect x="42" y="38.5" width="5" height="4.5" rx="1.2" opacity=".3"/>
  </g>
</svg>
