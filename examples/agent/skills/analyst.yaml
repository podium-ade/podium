# The skill the web chat starts with: answer a question from the data warehouse and show
# the SQL. It is what `profile.yaml: chat_default_skill` names, and it is reachable from
# Slack as `/analyst …` too.
#
# THIS SKILL READS EVERYTHING ITS CREDENTIAL CAN READ, and whatever it reads can end up in a
# chat transcript, in the shared memory, and — asked over Slack — in a Slack channel. The
# real control is the credential: give it a read-only role with a statement timeout. The
# recipe is in docs/agent.md#the-analyst-skill and the exposure is in docs/security.md.
#
# The image is the locally built :dev tag, so `make agent-runtime` is all it takes for this
# example to run against a dev stack. A real deployment pins
# ghcr.io/alvaroibarguen/podium-agent-runtime-data to a released tag.
image: podium-agent-runtime-data:dev
system_prompt: file:../prompts/analyst.md
# Write is for /workspace only — a CSV or a PNG under .podium/artifacts, which is how a
# result too long for a chat bubble reaches a human.
allowed_tools: [Bash, Read, Write]
max_turns: 60
timeout: 30m
resources: { cpu: 1, memory_mb: 2048 }
# A deployment sets ONE of these two and DELETES THE OTHER LINE. A task naming a secret the
# control plane does not have is refused before it reaches a node (docs/security.md#secrets),
# so leaving both here means no turn of this skill ever runs.
secrets:
  - { name: podium.agent.warehouse_url, target: env, key: WAREHOUSE_URL }
  - { name: podium.agent.warehouse_credentials, target: file, key: /podium/secrets/warehouse.json }
