# The playbook a mention gets when nothing else routes it: answer the question in the thread.
# It reads and it runs shell commands; it clones nothing and it holds no credentials beyond
# the model key the conductor attaches to every turn.
#
# It names no agent, model or effort, so it runs on whatever profile.yaml is set to. Adding
# `agent: grok` here — and nothing else — would run this one playbook on Grok and leave the
# rest of the bot alone.
#
# NO `image:` HERE, on purpose. A playbook that names none runs in the runtime published
# alongside the conductor reading it — ghcr.io/podium-ade/podium-agent-runtime at this build's
# own version — so the two are a matched pair and no release has to edit this file. An
# unstamped build falls back to the locally built podium-agent-runtime:dev, which is what
# `make agent-runtime` produces, so this example runs against a dev stack unchanged.
#
# Name one to override it: a pinned digest, or your own image built `FROM
# podium-agent-runtime` with whatever tools the work needs. Podium ships the base; every
# other image is yours. See docs/agent.md#extending-the-runtime-image.
system_prompt: file:../prompts/general.md
allowed_tools: [read, grep, glob, webfetch, bash]
max_turns: 50
timeout: 15m
# agent: grok
# model: grok-4.6
# effort: high
# The Agent Skills a turn of this playbook may use, by name, out of the conductor's skill
# library: the Skills screen in the web UI, plus PODIUM_AGENT_SKILLS_DIR on its host, which
# wins a name clash. Unset means none, and none is the default everywhere: the harness is
# handed a permission map that denies every skill it has not been told about. A skill is
# executable content somebody else wrote, running in the turn's container with the turn's
# credentials — read docs/security.md#a-playbook-that-carries-agent-skills before naming one.
# skills: [pr-review]
