# The playbook a mention gets when nothing else routes it: answer the question in the thread.
# It reads and it runs shell commands; it clones nothing and it holds no credentials beyond
# the model key the conductor attaches to every turn.
#
# It names no agent, model or effort, so it runs on whatever profile.yaml is set to. Adding
# `agent: grok` here — and nothing else — would run this one playbook on Grok and leave the
# rest of the bot alone.
#
# The image is the locally built :dev tag, so `make agent-runtime` is all it takes for this
# example to run against a dev stack. A real deployment pins
# ghcr.io/alvaroibarguen/podium-agent-runtime to a released tag — or names an image of its
# own, built `FROM podium-agent-runtime` with whatever tools the work needs. Podium ships the
# base and, for its own development, -dev; every other image is yours. See
# docs/agent.md#extending-the-runtime-image.
image: podium-agent-runtime:dev
system_prompt: file:../prompts/general.md
allowed_tools: [read, grep, glob, webfetch, bash]
max_turns: 50
timeout: 15m
# agent: grok
# model: grok-4.6
# effort: high
