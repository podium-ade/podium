# The bot's identity. One profile per conductor; PODIUM_AGENT_PROFILE_DIR points at the
# directory this file lives in. See docs/agent.md for every field.
name: podium
display_name: Podium
system_prompt: file:./prompts/profile.md
model: claude-opus-5
default_skill: general
# The web chat is for asking the warehouse questions, so that is what a chat message runs
# unless the human picks another skill with the chip. Delete this line and the chat falls
# back to default_skill.
chat_default_skill: analyst
