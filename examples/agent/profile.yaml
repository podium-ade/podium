# The bot's identity. One profile per conductor; PODIUM_AGENT_PROFILE_DIR points at the
# directory this file lives in. See docs/agent.md for every field.
#
# This is the WORKED EXAMPLE: one playbook, on the one image Podium ships, holding no
# credential of its own, and it loads and runs on any node. The profile the real bot runs is
# ../../playbooks, which is a different directory precisely so that neither has to pretend to
# be the other.
#
# This file describes TWO things at once, and it is worth knowing which is which:
#
#   - The ASSISTANT. Everything below down to `max_turns` is the turn that answers a
#     conversation, in the conductor's own process: its name, its prompt, its model, what it
#     may execute and how many steps it gets. It runs no container and touches no repository.
#   - Which playbook a MENTION or a TICKET runs, which is `default_playbook`. Those are one
#     piece of work each, so they run in a container on a node.
#
# A conversation names no playbook at all. The playbooks in playbooks/ are what the assistant
# DELEGATES to, one per piece of work, chosen by the turn rather than by a human up front.
name: podium
display_name: Podium
# The assistant's prompt. A playbook layers its own on top of this one for a task.
system_prompt: file:./prompts/profile.md
# The model the assistant answers on, and the default a playbook inherits.
model: claude-opus-5
# The backend it runs on. Unset means claude. `grok` is the same runtime image pointed at xAI,
# and it needs an xAI credential on the Settings tab.
agent: claude
# How hard the model thinks; unset means the model's own default. A playbook may name its own,
# and the levels a model accepts come from the picker.
# effort: high
# The Agent Skills the ASSISTANT may use, and how many steps it gets. Both are unset here: the
# assistant delegates anything that needs a machine, so it rarely wants either. They are
# file-only on purpose — what the thing running beside your master key may execute belongs in
# a repository, beside a review, and not behind a form in a browser.
# skills: [validate-pr]
# max_turns: 50   # unset means NO cap, unlike a playbook's
#
# Which playbook a Slack mention or a Linear ticket runs when nothing more specific routes it.
default_playbook: general
