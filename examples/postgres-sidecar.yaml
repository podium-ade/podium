# A task with a database beside it.
#
#   podium run --spec examples/postgres-sidecar.yaml
#
# The sidecar is a sibling container on the task's private network, reachable by the name
# it is keyed under — `db` — so nothing in the task has to know an address. The task
# container is not started until the readiness probe says Postgres is accepting
# connections, and both containers, the network and the workspace volume are removed when
# the task ends.
image: pgvector/pgvector:pg16
command: ["psql", "-h", "db", "-U", "postgres", "-c", "select 1"]
env:
  PGPASSWORD: podium

sidecars:
  db:
    image: pgvector/pgvector:pg16
    env:
      POSTGRES_PASSWORD: podium
    readiness:
      # `command` rather than `tcp_port` for two separate reasons, and only one of them is
      # about platforms.
      #
      # The portable reason: a database's own health command is the better probe. `nc`
      # answers as soon as the port is bound, which for Postgres is before it will accept a
      # connection, so `tcp_port` can start the task too early.
      #
      # The macOS/Windows reason: there, the node cannot route into the task network, so
      # `tcp_port` is tested from INSIDE the sidecar with `nc` — and this image
      # (Debian-based, like the official postgres one) has none, which fails the probe
      # outright. On a LINUX node whose Docker daemon is on the same host, the node dials
      # the sidecar directly and `tcp_port: 5432` works with no `nc` anywhere. See
      # docs/task-spec.md#readiness.
      command: ["pg_isready", "-U", "postgres"]
      timeout: 60s
    resources:
      cpu: 1
      memory_mb: 512

# Limits on the task container. Swap is pinned to the memory cap, so a task that runs out
# of memory is OOM-killed and reported as such rather than swapping the node to a halt.
resources:
  cpu: 1
  memory_mb: 256
  pids: 512

# The task container drops every Linux capability and runs with no-new-privileges and the
# engine's default seccomp profile whatever this section says; these are the only dials.
# psql needs neither a writable image nor any capability.
hardening:
  read_only_rootfs: true

timeout: 5m
