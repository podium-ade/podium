# Secrets, both ways they can be delivered.
#
#   podium secret set DB_PASSWORD          # prompts, or reads stdin
#   podium secret set DEPLOY_KEY < id_ed25519
#   podium run --spec examples/secrets.yaml
#
# The server needs PODIUM_MASTER_KEY_FILE set, or every secret call answers
# FailedPrecondition and a task naming a secret fails at admission with a message saying
# which name it could not find.
#
# READ docs/security.md BEFORE YOU RELY ON THIS. Two things matter most:
#   - Under the dev transport an assignment carries these values over an unencrypted
#     loopback socket. That is acceptable only because it is loopback.
#   - Log redaction is best-effort string matching, not a guarantee. A value the task
#     transforms — base64 of a fragment, a hash, a value split across two writes — is not
#     matched. Never print a secret and rely on redaction to catch it.
image: alpine:3
command:
  - sh
  - -c
  - |
    echo "env target:  DB_PASSWORD is ${#DB_PASSWORD} characters long"
    echo "file target: $(stat -c '%a %n' /podium/secrets/deploy_key)"
    echo "printing it would be redacted on the way out: $DB_PASSWORD"

secrets:
  # target: env is the default. `key` is the environment variable the value lands in, and
  # `name` is the stored secret it comes from; they are usually the same and both are
  # required. An env secret wins over an env: entry of the same name.
  - name: DB_PASSWORD
    target: env
    key: DB_PASSWORD

  # target: file writes the value to an absolute path, mode 0400, owned by the container's
  # user, on a tmpfs mounted noexec,nosuid at /podium/secrets. The file is overwritten with
  # zeroes and unlinked at teardown. The path must be absolute and clean.
  - name: DEPLOY_KEY
    target: file
    key: /podium/secrets/deploy_key

# A sidecar CANNOT reference a secret. If a database sidecar needs a password it takes it
# from a plaintext env: entry of its own. This is a known gap, not a design position.

timeout: 2m
