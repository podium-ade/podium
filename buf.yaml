version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    # NodeService.Stream is a bidirectional stream of oneof envelopes; the canonical names
    # (00-index.md) are NodeMessage/ServerMessage, not StreamRequest/StreamResponse.
    RPC_REQUEST_STANDARD_NAME:
      - proto/podium/v1/node.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/podium/v1/node.proto
      # TaskService.StreamTaskEvents streams the same TaskEvent nodes emit, unwrapped.
      - proto/podium/v1/task.proto
      # AgentService.StreamChat streams ChatFrame, which is also what the conductor's
      # in-process broadcaster fans out. Naming it StreamChatResponse would name one thing
      # twice.
      - proto/podium/agent/v1/agent.proto
breaking:
  use:
    - FILE
  ignore_only:
    # PR #354 removed the Connections "Triggers" section: the review on open is now the "Review
    # pull requests" routine, whose conditions replace GitHubConnection.filters (field 14 and
    # its name stay reserved). The removals are deliberate, and buf can only scope an ignore to
    # a file, not a symbol, so this covers agent.proto for these three rules only. Drop it once main
    # carries #354, since `make proto-breaking` compares against origin/main.
    FIELD_NO_DELETE:
      - proto/podium/agent/v1/agent.proto
    MESSAGE_NO_DELETE:
      - proto/podium/agent/v1/agent.proto
    RPC_NO_DELETE:
      - proto/podium/agent/v1/agent.proto
