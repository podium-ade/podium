# The GitHub App podium-agent connects as. Each operator creates THIS app in their own
# GitHub org — Podium does not ship a Marketplace listing. Create it at
# https://github.com/settings/apps/new (or the org equivalent) and paste these permissions
# and events. docs/agent.md walks through the rest: paste the private key and the webhook
# secret under Settings → Connections. The GitHub App environment variables are ignored.
#
# Replace WEBHOOK_URL with whatever Tailscale Funnel / tunnel points at the listen address
# saved with the App, path /webhooks/github. Exposing that mux must not
# expose the AgentService or the UI; see docs/networking.md.
#
# The bot's GitHub identity is this App. Playbook turns still clone with
# podium.agent.github_token; they must not `gh pr comment`. The App is the only writer
# on the pull request.
#
# Replace PODIUM_URL with the address people open Podium at. The callback lets each person
# connect their own GitHub account under Settings → Account. After creating the App, keep
# user-to-server token expiration on (the default) and generate a client secret. See
# docs/agent.md#the-askers-own-github-account.
name: Podium
url: https://github.com/podium-ade/podium
hook_attributes:
  url: WEBHOOK_URL
  active: true
callback_urls:
  - PODIUM_URL/agent/github/callback
description: >-
  Podium reviews a pull request when you tag it or request it as a reviewer. One session
  per pull request, running the playbook marked github: true. Whoever can tag the bot, or
  request it as a reviewer, can make that playbook run. There is no role model. See
  docs/security.md.
public: false
default_permissions:
  # Conversation-tab comments, including the working comment and the answer.
  issues: write
  # Inline review-comment replies, and reading the PR.
  pull_requests: write
  # Clone, push, and reading the repository for a transcript. The same App mints
  # installation tokens for turns.
  contents: write
  # Reading CI: a workflow run's jobs and their logs, and every CI app's check suites. Routines
  # that fix failing CI read them, and run on the workflow_run and check_suite events below.
  actions: read
  checks: read
  statuses: read
default_events:
  - issue_comment
  - pull_request
  - pull_request_review
  - pull_request_review_comment
  # Only routines on GitHub events run on these (docs/agent.md, "On a GitHub event"). A
  # delivery no routine asks for is dropped.
  - workflow_run
  - check_suite
  - issues
