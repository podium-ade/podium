# Development dependencies for podium-server: Postgres, and Hindsight behind a profile.
# The node daemon talks to the host's Docker, and object storage is not part of MVP-0.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d postgres
#   PODIUM_DATABASE_URL=postgres://podium:podium@127.0.0.1:5432/podium ./bin/podium-server
#
# The agents' shared memory is behind a profile because it is a 5.9 GB image and most work
# on Podium does not need it:
#
#   PODIUM_MEMORY_LLM_API_KEY=sk-ant-… docker compose -f deploy/docker-compose.dev.yml \
#     --profile memory up -d --wait postgres hindsight
#
# Integration tests do NOT use this file; they boot their own Postgres 16 via testcontainers.
name: podium-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: podium-dev-postgres
    environment:
      POSTGRES_USER: podium
      POSTGRES_PASSWORD: podium
      POSTGRES_DB: podium
    ports:
      # Loopback only: the credentials are dev throwaways. Override PODIUM_PG_PORT when
      # something else already owns 5432 on the host, and match PODIUM_DATABASE_URL to it.
      - "127.0.0.1:${PODIUM_PG_PORT:-5432}:5432"
    volumes:
      - podium-pgdata:/var/lib/postgresql/data
      # Creates podium_agent and podium_memory, and the pgvector extension in the latter.
      # Init scripts run ONLY on an empty data directory: a volume created before step 19
      # needs the recipe in docs/operations.md instead.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podium -d podium"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # The agents' shared memory. Same image and configuration as docker-compose.yml, with dev
  # throwaway credentials and the port on loopback — a task container reaching this needs
  # PODIUM_AGENT_MEMORY_TASK_URL pointed at the host's bridge address, not at loopback.
  hindsight:
    profiles: ["memory"]
    image: ghcr.io/vectorize-io/hindsight:0.9.2
    container_name: podium-dev-hindsight
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: 1g
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://podium:podium@postgres:5432/podium_memory
      # There is no authentication without these two, for REST or for MCP.
      # `:-` and not `:?` on purpose: a `:?` here makes compose refuse to interpolate the
      # WHOLE file, so `docker compose up postgres` would stop working on a deployment with
      # no memory. Left empty, the container refuses to start and says which variable is
      # missing — "HINDSIGHT_API_TENANT_API_KEY is required when using ApiKeyTenantExtension"
      # and "LLM API key is required" — which is fail-closed and names the fix.
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${PODIUM_AGENT_MEMORY_API_KEY:-memtoken}
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_MODEL: ${PODIUM_MEMORY_LLM_MODEL:-claude-opus-5}
      HINDSIGHT_API_LLM_API_KEY: ${PODIUM_MEMORY_LLM_API_KEY:-}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_WORKER_ID: hindsight
    ports:
      - "${PODIUM_MEMORY_BIND:-127.0.0.1}:${PODIUM_MEMORY_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  podium-pgdata:
