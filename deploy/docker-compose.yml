# A single-machine Podium: Postgres, MinIO and the control plane, with an optional worker
# node alongside them.
#
#   cd deploy
#   podium-server init            # writes master.key and a .env with fresh credentials
#   docker compose up -d --wait   # postgres, minio, server
#
# The worker is behind a profile, because the common case is workers on other machines:
#
#   TOKEN=$(podium node enroll-token --label linux/amd64)
#   PODIUM_NODE_ENROLL_TOKEN=$TOKEN docker compose --profile node up -d
#
# Every variable is documented in .env.example. Only postgres and minio can be brought up
# without the images being published:
#
#   docker compose up -d --wait postgres minio
#
# ---------------------------------------------------------------------------------------
# NOT YET EXERCISED. This file has never been brought up end to end. The build machine's
# Docker engine hosts unrelated work and no image may be pulled there, so minio/minio was
# never fetched and the ghcr.io images have never been published. Everything under
# internal/server/artifacts is tested against an in-process S3 endpoint instead
# (internal/server/artifacts/fakes3), which speaks the same API and verifies presigned
# signatures for real. `docker compose config` validates; nothing more has been proved.
# ---------------------------------------------------------------------------------------
name: podium

services:
  # Base images are pinned by digest. A tag is a moving target, and a base image is the part
  # of a supply chain nobody looks at.
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: podium
      POSTGRES_PASSWORD: ${PODIUM_PG_PASSWORD:?set PODIUM_PG_PASSWORD}
      POSTGRES_DB: podium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podium -d podium"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    # No published port. The server reaches it over the compose network, and nothing else
    # has any business talking to it.

  # The object store artifacts and rolled-up logs live in. Nodes never talk to it: an
  # artifact travels node -> server -> MinIO over NodeService.UploadArtifact, which is why
  # there is no published API port here and no credential anywhere near a worker.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PODIUM_S3_ACCESS_KEY:-podium}
      MINIO_ROOT_PASSWORD: ${PODIUM_S3_SECRET_KEY:?set PODIUM_S3_SECRET_KEY, at least 8 characters}
    volumes:
      # Artifacts and rolled-up logs are the ONLY copy of a finished task's output once its
      # chunks have been pruned out of Postgres. This volume is not a cache. Back it up.
      - miniodata:/data
    ports:
      # The console, on loopback only, so an operator can browse the bucket. The API port
      # (9000) is deliberately not published: the server reaches it over the compose network,
      # and a presigned URL is only useful to somebody who can already route to it. Publish
      # 9000 too if you want `podium artifact get --via-server=false` from your laptop.
      - "127.0.0.1:${PODIUM_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  server:
    # Multi-arch, built and pushed by .github/workflows/release.yml on a v* tag. Pin
    # PODIUM_IMAGE_TAG to a released version — `latest` moves under you.
    image: ghcr.io/alvaroibarguen/podium-server:${PODIUM_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PODIUM_DATABASE_URL: postgres://podium:${PODIUM_PG_PASSWORD:?}@postgres:5432/podium
      PODIUM_TRANSPORT: dev
      # Inside a container, loopback is the container's own. The port is published on the
      # host's loopback below, which is where the boundary actually is.
      PODIUM_DEV_LISTEN: 0.0.0.0:8080
      PODIUM_DEV_TOKEN: ${PODIUM_DEV_TOKEN:?set PODIUM_DEV_TOKEN}
      PODIUM_MASTER_KEY_FILE: /etc/podium/master.key
      # The object store. The bucket is created on start if it is missing.
      PODIUM_S3_ENDPOINT: minio:9000
      PODIUM_S3_BUCKET: ${PODIUM_S3_BUCKET:-podium}
      PODIUM_S3_ACCESS_KEY: ${PODIUM_S3_ACCESS_KEY:-podium}
      PODIUM_S3_SECRET_KEY: ${PODIUM_S3_SECRET_KEY:?}
      # Log roll-up. The defaults are here to be seen rather than because they need setting:
      # a finished task's logs move into the object store a minute after it settles, and the
      # hot rows are dropped a day later.
      PODIUM_LOG_ROLLUP_INTERVAL: ${PODIUM_LOG_ROLLUP_INTERVAL:-1m}
      PODIUM_LOG_PRUNE_INTERVAL: ${PODIUM_LOG_PRUNE_INTERVAL:-1h}
      PODIUM_LOG_CHUNK_GRACE: ${PODIUM_LOG_CHUNK_GRACE:-24h}
    volumes:
      - server-state:/var/lib/podium
      # The AES-256 key every stored secret is encrypted under, written by
      # `podium-server init` or `podium-server gen-master-key --out master.key`. Mode 0600 or
      # the server refuses to start. Back it up somewhere that is not this machine: there is
      # no recovery path.
      - ./master.key:/etc/podium/master.key:ro
    ports:
      - "127.0.0.1:${PODIUM_PORT:-8080}:8080"
    restart: unless-stopped
    # No healthcheck. The image is distroless: no shell, no curl, nothing a compose
    # healthcheck can exec. /healthz and /readyz are served for an external prober — point
    # your monitoring at http://127.0.0.1:8080/readyz, which is 503 while Postgres or the
    # object store is unreachable.

  # A worker on this same machine. Behind a profile because the usual shape is workers on
  # other machines — see deploy/install-node.sh and docs/networking.md.
  node:
    profiles: ["node"]
    image: ghcr.io/alvaroibarguen/podium-node:${PODIUM_IMAGE_TAG:-latest}
    depends_on:
      - server
    environment:
      PODIUM_NODE_SERVER: http://server:8080
      PODIUM_NODE_TRANSPORT: dev
      PODIUM_NODE_DEV_TOKEN: ${PODIUM_DEV_TOKEN:?}
      # Podium's own single-use enrollment token, from `podium node enroll-token`. Needed on
      # the first run only; drop it afterwards. Not the same thing as a Tailscale auth key.
      PODIUM_NODE_ENROLL_TOKEN: ${PODIUM_NODE_ENROLL_TOKEN:-}
      PODIUM_NODE_DATA_DIR: /var/lib/podium-node
      PODIUM_NODE_MAX_TASKS: ${PODIUM_NODE_MAX_TASKS:-4}
      PODIUM_NODE_LABELS: ${PODIUM_NODE_LABELS:-}
    volumes:
      # identity.json holds the node key and there is no recovery path for it.
      - node-state:/var/lib/podium-node
      # ROOT-EQUIVALENT ON THE HOST. Anything that can talk to this socket can start a
      # privileged container and own the machine. A node is a machine you are willing to let
      # arbitrary containers run on; do not point this at a machine that is anything else.
      # See docs/security.md.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  server-state:
  node-state:
