# A Podium control plane on a tailnet, with workers on other machines. One file, like
# docker-compose.yml — but unlike that file this one FAILS CLOSED on every credential, because
# a deployment that workers on other machines can reach is not a place for a default password.
#
#   docker compose -f docker-compose.tailnet.yml up -d --wait
#
# Six variables have no default and `up` will name any you leave out:
#
#   TS_AUTHKEY              reusable, pre-approved, tagged tag:podium-server. First run only —
#                           after that the server-state volume IS the device identity.
#   PODIUM_NODE_TS_AUTHKEY  the same for a co-located worker, tagged tag:podium-node
#   PODIUM_TAILNET          your MagicDNS suffix without .ts.net, e.g. tail0a1b2c
#   PODIUM_PG_PASSWORD      set it BEFORE the first `up`: it is baked into the volume
#   PODIUM_S3_SECRET_KEY    at least 8 characters
#   PODIUM_AGENT_TOKEN      what the server presents to the conductor
#
# `podium-server init --transport tailnet --tailnet <suffix>` writes a .env with the last three
# generated and the Tailscale ones left for you. A worked example, end to end, is in
# ../docs/quickstart.md#a-production-stack-concretely
#
# NO PUBLISHED PORTS AT ALL. The server listens on 443 of its own Tailscale device, so there is
# no host port to firewall and no public ingress. The exception is Hindsight's 8888, which
# workers must reach: set PODIUM_MEMORY_BIND to this host's tailnet address and allow
# tag:podium-node -> 8888 in the ACL. See ../docs/networking.md.
#
# Enable MagicDNS and HTTPS Certificates in the admin console first, or the server refuses to
# start and says which one is missing.
#
# ---------------------------------------------------------------------------------------
# UNVERIFIED. The tailnet transport itself is exercised — a server device and workers on other
# machines, reconnecting across restarts — but this file is not: bringing it up needs a real
# Tailscale auth key and a tailnet to join, which no test can supply. Treat it as the recipe,
# and docker-compose.yml as the proven one.
#
# The `agent` service in particular cannot work as written on this network, for the reason
# given where it is defined: the server has no address on the compose network here.
# ---------------------------------------------------------------------------------------
name: podium

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: podium
      POSTGRES_PASSWORD: ${PODIUM_PG_PASSWORD:?set PODIUM_PG_PASSWORD}
      POSTGRES_DB: podium
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: postgres-init               # inline below; runs only on an EMPTY volume
        target: /docker-entrypoint-initdb.d/10-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podium -d podium"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    # No published ports at all. The database is reached over the compose network by the
    # server, and by nothing else.

  # The agents' shared memory. Same as docker-compose.yml, with one difference that
  # matters: on a tailnet the workers are on other machines, so PODIUM_MEMORY_BIND should be
  # this host's tailnet IP and the tailnet ACL should allow tag:podium-node -> 8888. See
  # docs/networking.md.
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.2@sha256:84ab276b8f501546deb6ea9c64a57291718b4e16a59dd9e02a02fdd5adfe9028
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: 1g
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://podium:${PODIUM_PG_PASSWORD:?}@postgres:5432/podium_memory
      # There is no authentication without these two, for REST or for MCP.
      # `:-` and not `:?` on purpose: a `:?` here makes compose refuse to interpolate the
      # WHOLE file, so `docker compose up postgres` would stop working on a deployment with
      # no memory. Left empty, the container refuses to start and says which variable is
      # missing — "HINDSIGHT_API_TENANT_API_KEY is required when using ApiKeyTenantExtension"
      # and "LLM API key is required" — which is fail-closed and names the fix.
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${PODIUM_AGENT_MEMORY_API_KEY:-}
      # Any of Hindsight's ~25 providers; change the model to match.
      # https://hindsight.vectorize.io/developer/models
      HINDSIGHT_API_LLM_PROVIDER: ${PODIUM_MEMORY_LLM_PROVIDER:-anthropic}
      HINDSIGHT_API_LLM_MODEL: ${PODIUM_MEMORY_LLM_MODEL:-claude-opus-5}
      HINDSIGHT_API_LLM_API_KEY: ${PODIUM_MEMORY_LLM_API_KEY:-}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_WORKER_ID: hindsight
    ports:
      - "${PODIUM_MEMORY_BIND:-0.0.0.0}:${PODIUM_MEMORY_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Artifacts and rolled-up logs. Without this the server starts, says "artifacts are off",
  # and every upload fails failed_precondition — including an agent turn's transcript.jsonl.
  # Nodes never talk to it: an artifact goes node -> server -> here.
  objectstore:
    image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${PODIUM_S3_ACCESS_KEY:-podium}
      RUSTFS_SECRET_KEY: ${PODIUM_S3_SECRET_KEY:?set PODIUM_S3_SECRET_KEY, at least 8 characters}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - objectstore-data:/data            # the only copy of a finished task's output. Back it up.
    healthcheck:
      test: ["CMD", "sh", "-ec", "wget -q -O- http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Generates the master key into server-state on first `up`, then exits. Idempotent.
  # Without it the server runs with secrets DISABLED — every secret call answers
  # FailedPrecondition, which includes the conductor storing a model key from the UI.
  init:
    image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    volumes:
      # PODIUM_STATE_DIR=./state puts the master key and the tsnet identity on the HOST — files
      # you can see and back up, and ones `down -v` cannot take. Compose reads a path as a bind
      # mount and a bare name as a named volume. Must match the server's below.
      - ${PODIUM_STATE_DIR:-server-state}:/state
    command:
      - sh
      - -ec
      - |
        if [ ! -s /state/master.key ]; then
          umask 077
          head -c 32 /dev/urandom | od -An -tx1 | tr -d '[:space:]' > /state/master.key
          echo "init: generated a master key — back up the server-state volume"
        fi
        chmod 0600 /state/master.key
        chown -R 65532:65532 /state
    restart: "no"

  server:
    image: ${PODIUM_SERVER_IMAGE:-${PODIUM_IMAGE_REPO:-ghcr.io/podium-ade}/podium-server:${PODIUM_IMAGE_TAG:-latest}}
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      PODIUM_DATABASE_URL: postgres://podium:${PODIUM_PG_PASSWORD:?}@postgres:5432/podium
      PODIUM_TRANSPORT: tailnet
      PODIUM_MASTER_KEY_FILE: /var/lib/podium/master.key   # written by `init`; NO recovery path
      PODIUM_S3_ENDPOINT: objectstore:9000
      PODIUM_S3_BUCKET: ${PODIUM_S3_BUCKET:-podium}
      PODIUM_S3_ACCESS_KEY: ${PODIUM_S3_ACCESS_KEY:-podium}
      PODIUM_S3_SECRET_KEY: ${PODIUM_S3_SECRET_KEY:?}
      PODIUM_TS_HOSTNAME: podium
      PODIUM_TS_STATE_DIR: /var/lib/podium/tsnet
      # The Tailscale auth key. Read on the first run only: after that the state volume below
      # *is* the device identity. Never bake it into an image.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY to a reusable, pre-approved key tagged tag:podium-server}
      # The conductor's API, reverse-proxied behind this server's identity middleware — which
      # under this transport is Tailscale's WhoIs, so the login the conductor records is a
      # real person. Set PODIUM_AGENT_URL to the empty string to run without a conductor.
      PODIUM_AGENT_URL: ${PODIUM_AGENT_URL-http://agent:8090}
      PODIUM_AGENT_TOKEN: ${PODIUM_AGENT_TOKEN:?set PODIUM_AGENT_TOKEN}
    volumes:
      # Two unrecoverable credentials in one place: the master key `init` generated, and the
      # tsnet device identity. The latter MUST outlive the container — without it the server
      # registers a brand new Tailscale device on every restart, the MagicDNS name drifts to
      # podium-1, podium-2, ... and the admin console fills with ghosts. Set PODIUM_STATE_DIR
      # to a path to keep both on the host; same value as `init` above.
      - ${PODIUM_STATE_DIR:-server-state}:/var/lib/podium
    # Also no published ports: the server listens only inside the tailnet, on 443 of its own
    # Tailscale device. There is no host port to firewall and no public ingress to protect.
    restart: unless-stopped

  # The conductor. See docs/agent.md.
  #
  # NOTE, and it is not a small one: under PODIUM_TRANSPORT=tailnet the server listens ONLY
  # on 443 of its own Tailscale device. It has no port on the compose network, so a plain
  # sidecar container cannot reach it — this service works only on a host where the conductor
  # can route into the tailnet (the `host` transport with the machine's own tailscaled, or
  # podium-agent run on the host rather than in compose). Left here as the recipe; the tested
  # path is the local transport in docker-compose.yml. PODIUM_AGENT_API_TOKEN is empty on
  # purpose: over the tailnet, WhoIs names the caller.
  #
  agent:
    image: ${PODIUM_AGENT_IMAGE:-${PODIUM_IMAGE_REPO:-ghcr.io/podium-ade}/podium-agent:${PODIUM_IMAGE_TAG:-latest}}
    depends_on:
      - server
    environment:
      PODIUM_AGENT_SERVER: https://podium.${PODIUM_TAILNET:?set PODIUM_TAILNET, e.g. tail0a1b2c}.ts.net
      PODIUM_AGENT_DATABASE_URL: postgres://podium:${PODIUM_PG_PASSWORD:?}@postgres:5432/podium_agent
      PODIUM_AGENT_LISTEN: 0.0.0.0:8090
      PODIUM_AGENT_TOKEN: ${PODIUM_AGENT_TOKEN:?set PODIUM_AGENT_TOKEN}
      PODIUM_AGENT_PROFILE_DIR: /etc/podium/agent
      PODIUM_AGENT_SLACK_APP_TOKEN: ${PODIUM_AGENT_SLACK_APP_TOKEN:-}
      PODIUM_AGENT_SLACK_BOT_TOKEN: ${PODIUM_AGENT_SLACK_BOT_TOKEN:-}
      PODIUM_AGENT_LINEAR_API_KEY: ${PODIUM_AGENT_LINEAR_API_KEY:-}
      PODIUM_AGENT_LINEAR_POLL_INTERVAL: ${PODIUM_AGENT_LINEAR_POLL_INTERVAL:-30s}
      PODIUM_AGENT_LINEAR_URL: ${PODIUM_AGENT_LINEAR_URL:-https://api.linear.app/graphql}
      # The web UI as a human reaches it. On a tailnet that is the server's tailnet name,
      # which is also PODIUM_AGENT_SERVER, so the default is right here.
      PODIUM_AGENT_UI_URL: ${PODIUM_AGENT_UI_URL:-}
      # Shared memory. The task URL is what a container on a WORKER reaches Hindsight at,
      # which on a tailnet is this host's tailnet IP rather than host.docker.internal.
      PODIUM_AGENT_MEMORY_URL: ${PODIUM_AGENT_MEMORY_URL-http://hindsight:8888}
      PODIUM_AGENT_MEMORY_TASK_URL: ${PODIUM_AGENT_MEMORY_TASK_URL:-http://host.docker.internal:8888}
      PODIUM_AGENT_MEMORY_BANK: ${PODIUM_AGENT_MEMORY_BANK:-podium}
      PODIUM_AGENT_MEMORY_API_KEY: ${PODIUM_AGENT_MEMORY_API_KEY:-}
      # Grok. The credential is set in the web UI, not here; these three are the endpoint,
      # the OIDC issuer a subscription sign-in discovers from, and the OAuth client id.
      # An empty client id leaves the API key path, which is a supported configuration.
      PODIUM_AGENT_XAI_BASE_URL: ${PODIUM_AGENT_XAI_BASE_URL:-https://api.x.ai}
      PODIUM_AGENT_XAI_OAUTH_ISSUER: ${PODIUM_AGENT_XAI_OAUTH_ISSUER:-https://auth.x.ai}
      PODIUM_AGENT_XAI_OAUTH_CLIENT_ID: ${PODIUM_AGENT_XAI_OAUTH_CLIENT_ID:-}
    # No volumes: the image ships the worked example at /etc/podium/agent. Mount your own
    # profile directory over it, read-only, to run your own bot.
    restart: unless-stopped

  # A worker. In practice this runs on a *different machine* — that is the whole point of the
  # tailnet transport — so treat this service as the recipe rather than as a co-located node.
  node:
    profiles: ["node"]
    image: ${PODIUM_NODE_IMAGE:-${PODIUM_IMAGE_REPO:-ghcr.io/podium-ade}/podium-node:${PODIUM_IMAGE_TAG:-latest}}
    environment:
      PODIUM_NODE_SERVER: https://podium.${PODIUM_TAILNET:?set PODIUM_TAILNET, e.g. tail0a1b2c}.ts.net
      PODIUM_NODE_TRANSPORT: tailnet
      # The *Tailscale* auth key for workers: reusable, pre-approved, tagged tag:podium-node.
      # A different key from the server's, and a completely different thing from the Podium
      # enrollment token below.
      PODIUM_NODE_TS_AUTHKEY: ${PODIUM_NODE_TS_AUTHKEY:?set PODIUM_NODE_TS_AUTHKEY}
      # Podium's own single-use enrollment token, from `podium node enroll-token`. Needed on the
      # first run only; drop it afterwards.
      PODIUM_NODE_ENROLL_TOKEN: ${PODIUM_NODE_ENROLL_TOKEN:-}
      PODIUM_NODE_DATA_DIR: /var/lib/podium-node
      PODIUM_NODE_LABELS: linux/amd64
      PODIUM_NODE_MAX_TASKS: "4"
    volumes:
      # A HOST PATH, at the same absolute path inside the container and out, and it has to
      # be. This node drives the host's Docker daemon, so every bind mount it asks for is
      # resolved by THAT daemon against the HOST filesystem. The podium-runner it extracts
      # in here is bind mounted into every task container as PID 1 — and from a named volume
      # that source does not exist as far as the daemon is concerned, so every task dies at
      # creation with `bind source path does not exist`.
      # identity.json (the node key) and the node's own tsnet state both live here, and both
      # are credentials. Losing this directory means a new enrollment token and a ghost device.
      - /var/lib/podium-node:/var/lib/podium-node
      # Root-equivalent on the host. A node is a machine you are willing to let arbitrary
      # containers run on; do not point this at a machine that is anything else.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pgdata:
  objectstore-data:
  server-state:

# Inline, so this file needs nothing beside it. Byte-identical to postgres/init.sql, which
# docker-compose.dev.yml mounts from disk; `go test ./deploy/...` fails if they drift.
configs:
  postgres-init:
    content: |
      -- The databases beside podium's own. Postgres runs this ONLY on an empty data directory;
      -- to add them to an existing install, see docs/operations.md.
      create database podium_agent owner podium;   -- the conductor's, migrated by podium-agent
      create database podium_memory owner podium;  -- Hindsight's, migrated by Hindsight

      \connect podium_memory

      -- Hindsight needs pgvector in `public` and would otherwise DROP EXTENSION ... CASCADE and
      -- recreate it there itself. podium and podium_agent stay extension-free.
      create extension if not exists vector;
